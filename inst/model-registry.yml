  # --- TF24: the soil water column ------------------------------------------------
  TF24.soil_number_of_depths:
    model: TF24
    section: tf24_soil
    symbol: 'N'
    units: '–'
    class: setting
    meaning: 'number of soil layers, from the top ($i = 0$) to the bottom ($i = N - 1$); also the number of resources the patch takes up, one per layer'
    source: 'TF24_Environment constructor default; reset by set_soil_number_of_depths, or by the count of widths set_soil_layer_widths is given'
    placeholder: false
    code: plant::TF24_Environment::soil_number_of_depths
  TF24.depth:
    model: TF24
    section: tf24_soil
    symbol: 'D'
    units: 'm'
    class: hyperparameter
    meaning: 'total depth of the soil column, the sum of the layer widths and the depth to the bottom of the deepest layer; read-only from R, since only the geometry setters rebuild the layers from it'
    source: 'TF24_Environment constructor default; set_soil_layer_widths overwrites it with the sum of the widths. No source recorded'
    placeholder: true
    code: plant::TF24_Environment::depth
  TF24.dz:
    model: TF24
    section: tf24_soil
    symbol: '\Delta z_i'
    units: 'm'
    class: setting
    meaning: 'width of layer $i$: the geometry a caller states, from which the boundaries and midpoints follow. Equal widths $D / N$ unless set_soil_layer_widths gives them, and then they must not decrease with depth'
    source: 'equal layers spanning $D$ by default; set_soil_layer_widths (or set_tf24_soil) for a graded profile'
    placeholder: false
    code: plant::TF24_Environment::dz
  TF24.soil_moist_sat:
    model: TF24
    section: tf24_soil
    symbol: '\theta_{\rm sat}'
    units: 'm³ m⁻³'
    class: hyperparameter
    meaning: 'saturated volumetric water content: the reference moisture of the retention, conductivity and infiltration curves and the capacity a water pulse fills to; not a bound on the integrated state. One value for every layer unless set_soil_parameters gives one per layer'
    source: 'TF24_Environment constructor default; no source recorded'
    placeholder: true
    code: plant::TF24_Environment::soil_moist_sat
    aliases: [plant::TF24_Environment::soil_moist_sat_layers]
  TF24.K_sat:
    model: TF24
    section: tf24_soil
    symbol: 'K_{\rm sat}'
    units: 'm yr⁻¹'
    class: hyperparameter
    meaning: 'saturated hydraulic conductivity: the drainage flux out of the base of a saturated layer. One value for every layer unless set_soil_parameters gives one per layer'
    source: 'TF24_Environment constructor default; no source recorded. The header gives no units; m yr⁻¹ follows from the water balance, whose fluxes are in m yr⁻¹'
    placeholder: true
    code: plant::TF24_Environment::K_sat
    aliases: [plant::TF24_Environment::K_sat_layers]
  TF24.a_psi:
    model: TF24
    section: tf24_soil
    symbol: 'a_\psi'
    units: 'MPa'
    class: hyperparameter
    meaning: 'scale of the retention curve: the potential magnitude of a layer at saturation. One value for every layer unless set_soil_parameters gives one per layer'
    source: 'TF24_Environment constructor default, held in MPa (in Pa until the development version, NEWS); no source recorded'
    placeholder: true
    code: plant::TF24_Environment::a_psi
    aliases: [plant::TF24_Environment::a_psi_layers]
  TF24.n_psi:
    model: TF24
    section: tf24_soil
    symbol: 'n_\psi'
    units: '–'
    class: hyperparameter
    meaning: 'exponent of the retention curve (Clapp and Hornberger''s $b$); also sets the conductivity exponent $2 n_\psi + 3$. One value for every layer unless set_soil_parameters gives one per layer'
    source: 'TF24_Environment constructor default; no source recorded'
    placeholder: true
    code: plant::TF24_Environment::n_psi
    aliases: [plant::TF24_Environment::n_psi_layers]
  TF24.a_infil:
    model: TF24
    section: tf24_soil
    symbol: 'a_{\rm infil}'
    units: '–'
    class: hyperparameter
    meaning: 'strength of saturation-excess runoff: 0 lets all rain infiltrate, 1 applies the full term'
    source: 'TF24_Environment constructor default; calibrated, per NEWS, against a 0.3 m surface layer, with no source recorded'
    placeholder: true
    code: plant::TF24_Environment::a_infil
  TF24.b_infil:
    model: TF24
    section: tf24_soil
    symbol: 'b_{\rm infil}'
    units: '–'
    class: hyperparameter
    meaning: 'how sharply runoff rises as the top layer nears saturation. It reads layer 0 alone, so its calibration holds only for the width of layer 0 it was made at'
    source: 'TF24_Environment constructor default; calibrated, per NEWS, against a 0.3 m surface layer, with no source recorded'
    placeholder: true
    code: plant::TF24_Environment::b_infil
  TF24.soil_moist_residual:
    model: TF24
    section: tf24_soil
    symbol: '\theta_r'
    units: 'm³ m⁻³'
    class: setting
    meaning: 'residual moisture: a layer at or below it is not dried further, and the retention curve is evaluated at no less than it so the potential stays finite. A numerical floor, set well below operating moisture'
    source: 'TF24_Environment member default; not bound in R'
    placeholder: false
    code: plant::TF24_Environment::soil_moist_residual
  TF24.soil_psi_max_:
    model: TF24
    section: tf24_soil
    symbol: '\psi^\ast_{\max}'
    units: 'MPa'
    class: setting
    meaning: 'ceiling on the soil potential magnitude, which keeps the leaf''s hydraulic solve finite near the residual floor; set where root conductivity is already zero, so it does not change uptake'
    source: 'TF24_Environment member default; not bound in R'
    placeholder: false
    code: plant::TF24_Environment::soil_psi_max_
  TF24.rainfall:
    model: TF24
    section: tf24_soil
    symbol: 'P'
    units: 'm yr⁻¹'
    class: driver
    meaning: 'rainfall rate: the extrinsic driver named "rainfall", a constant or a spline of time'
    source: 'set constant in the TF24_Environment constructor; a site sets it with extrinsic_drivers_set_constant or extrinsic_drivers_set_variable'
    placeholder: true
    code: plant::Environment::extrinsic_drivers

equations:
  # --- individual plants --------------------------------------------------------
  height_trajectory:
    section: individual
    title: Height along a life history
    latex: |
      H(x, a_0, a) = H_0(x) + \int_{a_0}^{a} g(x, H(x, a_0, a^\prime), E_{a^\prime}) \, {\rm d}a^\prime
    code: plant::Individual::compute_rates
    also: [plant::Individual::Individual, plant::Node::compute_initial_conditions]
    reads: [H_0, g]
    writes: []
    kind: integrator
    overstorey: theory/size-structured-pde.qmd
    note: 'Integrated as the height state, seated at $H_0$ when the individual is constructed; the model sets its rate in compute_rates.'
  survival_individual:
    section: individual
    title: Survival of an individual
    latex: |
      S_{\rm I} (x, a_0, a) = S_{\rm G} (x, H_0, E_{{\rm a}0}) \, \exp\left(- \int_{a_0}^{a} d(x, H(x, a_0, a^\prime), E_{a^\prime}) \, {\rm d} a^\prime \right)
    code: plant::Node::survival_individual
    reads: [S_G, d]
    writes: []
    kind: integrator
    overstorey: theory/size-structured-pde.qmd
    note: 'The exponential of minus the cumulative-mortality state, which starts at $-\ln S_{\rm G}$ (mortality_ode); zero rather than non-finite where that state has run away.'
  lifetime_offspring:
    section: individual
    title: Cumulative offspring of an individual
    latex: |
      \tilde{R}(x, a_0, a) = \int_{a_0}^{a} f(x, H(x, a_0, a^\prime), E_{a^\prime}) \, S_{\rm I} (x, a_0, a^\prime) \, S_{\rm P} (a_0, a^\prime) \, {\rm d} a^\prime
    code: plant::Node::fecundity
    also: [plant::Node::compute_node_rates]
    reads: [f, S_G, d]
    writes: []
    kind: integrator
    overstorey: theory/size-structured-pde.qmd
    note: 'The code includes the patch-survival factor $S_{\rm P}(a_0, a^\prime)$, which the page''s equation omits; it does not include $S_{\rm D}$, which adaptive-dynamics.qmd puts inside $\tilde{R}$ and plant applies afterwards (net_reproduction_ratio). Carried as the node state offspring_produced_survival_weighted.'

  # --- light and crown shape ----------------------------------------------------
  canopy_openness:
    section: light
    title: Canopy openness
    latex: |
      E_a(z) = \exp \left(-\frac{k_{\rm I}}{A_{\rm P}} \sum_{i = 1}^{K} \int_{0}^{\infty} A_{\rm l}(H) \, Q(z, H) \, N(H | x_i, a) \, {\rm d}H \right)
    code: plant::build_extinction_field
    also: [plant::Patch::compute_environment, plant::Patch::compute_competition_and_slope, plant::Species::compute_competition_and_slope, plant::Node::compute_competition, plant::Individual::compute_competition]
    reads: [k_I, A_l, Q, patch_area]
    writes: []
    kind: integrator
    overstorey: theory/size-structured-pde.qmd
    note: 'The code divides the summed contribution by the patch area $A_{\rm P}$, which the page omits (it is 1 by default). Each model returns $k_{\rm I} A_{\rm l}(H) Q(z, H)$ as one competition contribution (K93 returns $k_{\rm I}$ times basal area times $Q$: basal area takes the place of $A_{\rm l}$). The integral is a trapezium over the nodes in the coordinate the density is carried in (over birth date, $\int \nu(a_0) \ldots {\rm d}a_0$, on that coordinate), and $E_a$ is then interpolated by a spline in height. The Control shading model can replace $Q$ (flat-top boxes) or step the profile (PPA).'
  crown_profile:
    section: light
    title: Leaf area above a height
    latex: |
      Q(z, H) = \left(1-\left(\frac{z}{H}\right)^\eta\right)^2
    code: plant::CanopyShape::Q
    also: [plant::CanopyShape::leaf_area_above, plant::CanopyShape::Q_from_height]
    reads: [eta]
    writes: []
    kind: closed_form
    fills: Q
    cite: Yokozawa-1995
    overstorey: theory/models/ff16.qmd
    note: 'Zero above the crown ($z > H$). Shared by every model (FF16, K93 and the TF24 family); written on the page for FF16.'
  crown_density:
    section: light
    title: Vertical distribution of leaf area
    latex: |
      q(z, H) = 2\frac{\eta}{H}\left(1-\left(\frac{z}{H}\right)^{\eta}\right) \left(\frac{z}{H}\right)^{\eta-1}
    code: plant::CanopyShape::q
    also: [plant::CanopyShape::q_from_height, plant::CanopyShape::Q_and_q]
    reads: [eta]
    writes: []
    kind: closed_form
    cite: Yokozawa-1995
    overstorey: theory/models/ff16.qmd
    note: 'Exactly $-\partial Q / \partial z$. The code writes it as $2\eta(1 - u^\eta)u^\eta / z$ with $u = z/H$ and takes the limit at the crown base (0 for $\eta > 1$, $2/H$ at $\eta = 1$).'
  crown_centre:
    section: light
    title: Crown-shape factor
    latex: |
      \eta_{\rm c} = 1 - \frac{2}{1 + \eta} + \frac{1}{1 + 2\eta}
    code: plant::CanopyShape::eta_c
    reads: [eta]
    writes: []
    kind: closed_form
    cite: Yokozawa-1995
    overstorey: theory/models/ff16.qmd
    note: 'Inline on the page, in the sapwood-mass section. The code also uses $z = \eta_{\rm c} H$ as the crown centre for the crown-centre shading models.'

  # --- the size-density equation ------------------------------------------------
  density_pde_height:
    section: size_density
    title: The size-density PDE in height
    latex: |
      \frac{\partial}{\partial a} N(H | x, a) = - d(x, H, E_a) \, N(H | x, a) - \frac{\partial}{\partial H} \left[g(x, H, E_a) \, N(H | x, a)\right]
    code: plant::Individual::log_density_rate
    also: [plant::Node::compute_node_rates]
    reads: [g, d]
    writes: []
    kind: derivative
    cite: DeRoos-1997
    overstorey: theory/size-structured-pde.qmd
    note: 'plant never discretises the PDE on a size grid: it integrates it along characteristics (log_density_height, or log_density_birth_date). The height form needs $g$ to depend on size and the light field alone, so a model carrying state that feeds back into growth (TF24) carries the density in birth date.'
  density_boundary_height:
    section: size_density
    title: Inflow at birth height
    latex: |
      N(H_0 | x, a_0) = \left\{
      \begin{array}{ll} \frac{Y_{x}(a_0) \, S_{\rm G} (x, H_0, E_{{\rm a}0}) }{ g(x, H_0, E_{{\rm a}0}) } & \textrm{if } g(x, H_0, E_{{\rm a}0}) > 0 \\
      0 & \textrm{otherwise.}
      \end{array} \right.
    code: plant::Node::compute_initial_conditions
    also: [plant::Species::compute_boundary_node]
    reads: [Y_x, S_G, g, H_0]
    writes: []
    kind: closed_form
    cite: Falster-2011
    overstorey: theory/size-structured-pde.qmd
    note: 'The code reads the arrival rate at the birth date, $Y_x(a_0)$ (birth_rate_at), where the page writes a constant $Y_x$; the two agree for the default constant birth rate. The boundary node is re-evaluated every step and copied when a cohort is introduced.'
  density_initial:
    section: size_density
    title: An empty patch after disturbance
    latex: |
      N\left(H|x,0\right) = 0
    code: plant::Patch::reset
    reads: []
    writes: []
    kind: identity
    overstorey: theory/size-structured-pde.qmd
    note: 'The default. A non-empty Parameters initial_state starts the patch from that stand instead (a resumed run or a given size distribution), the alternative the page mentions.'

  # --- along characteristics ----------------------------------------------------
  height_ode:
    section: characteristics
    title: Height along a characteristic
    latex: |
      \frac{dy}{dt} = g(x, y, t), \qquad y(0) = H_0(x)
    code: plant::Individual::compute_rates
    also: [plant::Individual::Individual, plant::Node::compute_initial_conditions]
    reads: [g, H_0]
    writes: []
    kind: derivative
    overstorey: theory/implementation/characteristic-method.qmd
    note: 'Time $t$ runs from the birth date $a_0$; $y$ is the height state.'
  mortality_ode:
    section: characteristics
    title: Cumulative mortality along a characteristic
    latex: |
      \frac{dy}{dt} = d(x, H_i(t) , E_t), \qquad y(0) = - \ln\left(S_{\rm G} (x, H_0, E_{a0})\right), \qquad S_{\rm I} (x, a_0, a) = \exp\left( - y(a) \right)
    code: plant::Node::compute_initial_conditions
    also: [plant::Individual::compute_rates, plant::Node::survival_individual, plant::establishment_failure_hazard]
    reads: [d, S_G]
    writes: []
    kind: derivative
    overstorey: theory/implementation/characteristic-method.qmd
    note: 'compute_initial_conditions seats $y(0)$; the model sets the rate. Where $S_{\rm G} = 0$ the code seats a finite sentinel (establishment_failure_hazard) instead of $+\infty$.'
  offspring_ode:
    section: characteristics
    title: Offspring along a characteristic
    latex: |
      \frac{dy}{dt} = f(x, H_i(t), E_t) \, S_{\rm I} (x, a_0,t) \, S_{\rm P} (a_0, t), \qquad y(0) = 0
    code: plant::Node::compute_node_rates
    also: [plant::Node::offspring_dt_dfecundity_rate, plant::Node::survival_individual]
    reads: [f, S_G, d]
    writes: []
    kind: derivative
    overstorey: theory/implementation/characteristic-method.qmd
    note: 'The page multiplies the rate by $S_{\rm D}$; the code does not, and applies $S_{\rm D}$ once to the lifetime total (Node::weighted_fecundity). $S_{\rm P}(a_0, t)$ is formed as $S_{\rm P}(0, t) / S_{\rm P}(0, a_0)$.'
  log_density_height:
    section: characteristics
    title: Log density along a characteristic, in height
    latex: |
      \frac{dy}{dt} = \frac{\partial g(x, H_i(t), E_t)}{\partial H} + d(x, H_i(t), E_t), \qquad y(0) = - \ln N(H_0 | x, a_0), \qquad N(H_i(t) | x, t) = \exp( - y(t))
    code: plant::Individual::log_density_rate
    also: [plant::Node::compute_node_rates, plant::Node::compute_initial_conditions, plant::Individual::growth_rate_gradient]
    reads: [g, d, Y_x, S_G]
    writes: []
    kind: derivative
    cite: DeRoos-1997
    overstorey: theory/implementation/characteristic-method.qmd
    note: 'The code carries $\ln N = -y$. The page writes $y(0) = -\ln(N(H_0 | x, a_0)\, S_{\rm G})$, a second factor of $S_{\rm G}$ on top of the one already in the boundary density; the code applies $S_{\rm G}$ once, through density_boundary_height. The page also labels the result $N(H_0 | x, a_0)$ where it means $N(H | x, a)$. $\partial g / \partial H$ is a finite difference (or Richardson extrapolation) by a further rate evaluation at a displaced height. The rate is held at zero for a cohort with no density.'
  density_characteristic_height:
    section: characteristics
    title: Density along a characteristic, in height
    latex: |
      N(H | x, a) = N(H_0 | x, a_0)
      \exp \left( - \int _{a_0}^{a} \left[\frac{\partial g(x, H(x, a_0, a^\prime), E_{a^\prime})}{\partial H} + d(x, H(x, a_0, a^\prime), E_{a^\prime})\right] {\rm d} a^\prime \right)
    code: plant::Node::get_density
    reads: [g, d]
    writes: []
    kind: integrator
    cite: DeRoos-1997
    overstorey: theory/implementation/characteristic-method.qmd
  log_density_birth_date:
    section: characteristics
    title: Log density along a characteristic, in birth date
    latex: |
      \frac{dy}{dt} = d(x, H_i(t), E_t), \qquad y(0) = - \ln\left(Y_x(a_0) \, S_{\rm G} (x, H_0, E_{{\rm a}0})\right), \qquad \nu(a_0 | x, t) = \exp( - y(t))
    code: plant::Individual::log_density_rate
    also: [plant::Node::compute_node_rates, plant::Node::compute_initial_conditions, plant::density_in_birth_date]
    reads: [d, Y_x, S_G]
    writes: []
    kind: derivative
    note: 'Not on an Overstorey page. $\nu$ is the density per unit birth date: nothing moves a cohort along the birth-date axis, so there is no compression term and the inflow is not divided by $g$. Chosen by Control node_density_coordinate ("auto" takes the model''s default: birth date for TF24, height otherwise).'
  birth_date_jacobian:
    section: characteristics
    title: From a density in birth date to a density in height
    latex: |
      N(H | x, a) = \nu(a_0 | x, a) \left| \frac{\partial H(x, a_0, a)}{\partial a_0} \right|^{-1}, \qquad \left. \frac{\partial H}{\partial a_0} \right|_{a = a_0} = - g(x, H_0, E_{{\rm a}0})
    code: plant::Species::height_jacobian
    also: [plant::Node::growth_rate_at_birth]
    reads: [g, H_0]
    writes: []
    kind: identity
    overstorey: theory/size-structured-pde.qmd
    note: 'The page''s change of size unit, $N^\prime(H) = N(M)\, {\rm d}M / {\rm d}H$, with birth date $a_0$ as $M$. Exact at the boundary node; a difference of node heights over birth dates elsewhere: central for interior nodes, one-sided for the oldest. Used to report densities in height, not to integrate.'

  # --- patch age ----------------------------------------------------------------
  patch_age_ode:
    section: patch_age
    title: Equilibrium patch-age dynamics
    latex: |
      \frac{{\rm d}}{{\rm d} a} P(a) = - d_{\rm P}(a) \, P(a), \qquad P(0) = \int_0^\infty d_{\rm P}(a) \, P(a) \, {\rm d} a
    code: ~
    reads: []
    writes: []
    kind: derivative
    cite: McKendrick-1926
    overstorey: theory/size-structured-pde.qmd
    note: 'Never integrated: each regime supplies its solution in closed form (patch_age_density).'
  patch_survival:
    section: patch_age
    title: Patch survival
    latex: |
      S_{\rm P} (a_0, a) = \exp\left( - \int_{a_0}^{a} d_{\rm P}(a^\prime) \, {\rm d} a^\prime \right)
    code: plant::Disturbance_Regime::pr_survival
    also: [plant::Node::offspring_dt_dfecundity_rate]
    reads: [patch_type]
    writes: []
    kind: integrator
    overstorey: theory/size-structured-pde.qmd
    note: 'The regime evaluates $S_{\rm P}(0, a)$ in closed form; a node stores it at its birth and forms $S_{\rm P}(a_0, a)$ as the ratio.'
  patch_age_density:
    section: patch_age
    title: Equilibrium patch-age distribution
    latex: |
      P(a) = P(0) S_{\rm P} (0, a), \qquad P(0) = \frac1{\int_0^\infty S_{\rm P} (0, a) {\rm d}a}
    code: plant::Disturbance_Regime::density
    also: [plant::Node::patch_density]
    reads: [patch_type]
    writes: []
    kind: closed_form
    overstorey: theory/size-structured-pde.qmd
    note: 'Read at each cohort''s birth date and stored on the node, where the fitness integrals weight by it.'
  weibull_patch_ages:
    section: patch_age
    title: Weibull disturbance
    latex: |
      d_{\rm P}(a) = \lambda \psi a^{\psi-1}, \qquad S_{\rm P}(0, a) = \exp(-\lambda a^\psi), \qquad P(0) = \frac{\psi \lambda^{\frac1{\psi}}}{\Gamma\left(\frac1{\psi}\right)}
    code: plant::Weibull_Disturbance_Regime::pr_survival
    also: [plant::Weibull_Disturbance_Regime::density, plant::Weibull_Disturbance_Regime::Weibull_Disturbance_Regime]
    reads: [shape, patch_type]
    writes: []
    kind: closed_form
    overstorey: theory/size-structured-pde.qmd
    note: 'patch_type "meta-population". The hazard $d_{\rm P}$ is implied by $S_{\rm P}$; no function evaluates it.'
  weibull_scale:
    section: patch_age
    title: Weibull scale from the mean disturbance interval
    latex: |
      \lambda = \left(\frac{\Gamma\left(\frac1{\psi}\right)}{\psi \bar{a}}\right)^{\psi}
    code: plant::Weibull_Disturbance_Regime::Weibull_Disturbance_Regime
    reads: [shape]
    writes: []
    kind: closed_form
    overstorey: theory/size-structured-pde.qmd
    note: 'The code writes $\Gamma(1 + 1/\psi)/\bar{a}$, the same number.'
  weibull_mean_interval:
    section: patch_age
    title: Mean disturbance interval from max_patch_lifetime
    latex: |
      \bar{a} = \frac{a_{\rm max} \, \Gamma\left(\frac1{\psi}\right)}{\psi \sqrt{-\ln \epsilon}}
    code: plant::Weibull_Disturbance_Regime::Weibull_Disturbance_Regime
    also: [plant::Weibull_Disturbance_Regime::r_mean_interval]
    reads: [max_patch_lifetime, shape, icdf_limit]
    writes: []
    kind: closed_form
    note: 'Not on an Overstorey page, which takes $\bar{a}$ as the single parameter; plant takes $a_{\rm max}$ and derives $\bar{a}$ so that $S_{\rm P}(0, a_{\rm max}) = \epsilon$. The square root is $(-\ln \epsilon)^{1/\psi}$ at $\psi = 2$, the only shape the code uses.'
  no_disturbance:
    section: patch_age
    title: No disturbance
    latex: |
      P(a) = 1, \qquad S_{\rm P}(a_0, a) = 1
    code: plant::No_Disturbance::density
    also: [plant::No_Disturbance::pr_survival]
    reads: [patch_type]
    writes: []
    kind: identity
    note: 'Not on an Overstorey page. patch_type "fixed": a single patch run to max_patch_lifetime; $P$ is a unit weight rather than a density, so fitness is the unweighted integral of lifetime output over birth dates.'
  fitness_window_weight:
    section: patch_age
    title: The fitness window's arrival weight
    latex: |
      P(a_0) = \frac{v(a_0)}{\int_{a_{\rm start}}^{a_{\rm end}} v(a) \, {\rm d}a} \text{ for } a_{\rm start} \le a_0 \le a_{\rm end}, \text{ and } 0 \text{ otherwise}, \qquad S_{\rm P}(a_0, a) = 1
    code: plant::Fitness_Window::density
    also: [plant::Fitness_Window::pr_survival, plant::Fitness_Window::Fitness_Window]
    reads: [patch_type, fitness_window_start, fitness_window_end, fitness_window_weight_x, fitness_window_weight_y]
    writes: []
    kind: closed_form
    note: 'Not on an Overstorey page. patch_type "fitness_window": one long run with no disturbance, weighting arrivals by date. $v$ is piecewise linear through the knots $(a_k, v_k)$, constant beyond the end knots, and 1 with no knots.'

  # --- reproduction ---------------------------------------------------------------
  net_reproduction_ratio:
    section: reproduction
    title: Net reproduction ratio
    latex: |
      R\left(x^\prime,x\right) = \int _0^{a_{\rm max}} P\left(a_0\right) \, S_{\rm D} \, \tilde{R}\left(x^\prime, a_0, a_{\rm max} \right) \, {\rm d}a_0
    code: plant::Patch::net_reproduction_ratio_of
    also: [plant::Patch::fitness_integral, plant::Node::weighted_fecundity, plant::Species::weighted_fecundity_by_node, plant::util::trapezium]
    reads: [S_D, f, d, S_G, patch_type, max_patch_lifetime]
    writes: []
    kind: integrator
    overstorey: theory/adaptive-dynamics.qmd
    note: 'Here $\tilde{R}$ is lifetime_offspring, without $S_{\rm D}$; the page puts $S_{\rm D}$ inside $\tilde{R}$ and integrates to $\infty$, where the code stops at the end of the run, $a_{\rm max}$. A trapezium over the cohorts'' birth dates; with the absorbing top layer on, the seeds its cohorts produce after absorption are added.'
  net_reproduction_ratio_window:
    section: reproduction
    title: Net reproduction ratio over a fitness window
    latex: |
      R = \frac{\int_{a_{\rm first}}^{a_{\rm last}} P(a_0) \, S_{\rm D} \, \tilde{R}(x, a_0, a_{\rm max}) \, {\rm d}a_0}{\int_{a_{\rm first}}^{a_{\rm last}} P(a_0) \, {\rm d}a_0}
    code: plant::Patch::fitness_integral
    also: [plant::Fitness_Window::density]
    reads: [S_D, f, fitness_window_start, fitness_window_end]
    writes: []
    kind: integrator
    note: 'Not on an Overstorey page. The weighted mean lifetime output over the cohorts the window weights, $a_{\rm first}$ and $a_{\rm last}$ being the first and last of them; normalised over those cohorts so the edge cohorts get half an interval however the schedule sits against the window.'
  offspring_production:
    section: reproduction
    title: Offspring production
    latex: |
      Y_x^{\rm out} = \int_0^{a_{\rm max}} Y_x(a_0) \, P(a_0) \, S_{\rm D} \, \tilde{R}(x, a_0, a_{\rm max}) \, {\rm d} a_0
    code: plant::Patch::offspring_production_of
    also: [plant::Patch::fitness_integral, plant::Model::birth_rate_at]
    reads: [Y_x, S_D, f, max_patch_lifetime]
    writes: []
    kind: integrator
    overstorey: theory/size-structured-pde.qmd
    note: 'The page writes the seed rain over heights and patch ages, $Y_x = \int_0^{\infty} \int_0^{\infty} P(a) \, S_{\rm D} \, f(x, H, E_a) \, N(H | x, a) \, {\rm d} H \, {\rm d} a$; the code evaluates the same total over birth dates (substituting $N\,{\rm d}H = Y_x(a_0) S_{\rm I}\,{\rm d}a_0$ and $P(a) = P(a_0) S_{\rm P}(a_0, a)$), to the end of the run rather than $\infty$, with an arrival rate that may vary with $a_0$. At demographic equilibrium $Y_x^{\rm out} = Y_x$.'

  # --- stand totals -------------------------------------------------------------
  stand_total:
    section: stand
    title: A stand total within a patch
    latex: |
      W(a) = \sum_{i = 1}^{N} \int_{0}^{\infty} N(H | x_i, a)\, w(x_i, H, E_a) \, {\rm d}H
    code: plant::SCM::census_sum
    also: [plant::Species::census_integral, plant::Individual::census_value, plant::SCM::census]
    reads: [w]
    writes: []
    kind: integrator
    overstorey: theory/size-structured-pde.qmd
    note: 'At the current patch age, per patch (not divided by the patch area). A trapezium over the nodes in the density''s own coordinate ($\int \nu\, w \, {\rm d}a_0$ on the birth-date one), plus the absorbed top layer. The page''s upper summation limit $N$ is the number of species ($K$ elsewhere on the page).'

  # --- FF16: production -----------------------------------------------------------
  FF16.leaf_photosynthesis:
    model: FF16
    section: ff16_production
    title: Leaf photosynthesis
    latex: |
      p(x, E(z)) = \alpha_{{\rm p1}} \frac{ E(z)}{E(z) + \alpha_{{\rm p2}}}
    code: plant::FF16_Model::assimilation_leaf
    also: [plant::ff16_assimilation_leaf]
    reads: [FF16.a_p1, FF16.a_p2]
    writes: []
    kind: closed_form
    cite: Falster-2011
    overstorey: theory/models/ff16.qmd
  FF16.crown_photosynthesis:
    model: FF16
    section: ff16_production
    title: Photosynthesis averaged over the crown
    latex: |
      \bar{p}(x, H, E_{a}) = \int_0^H p(x, E_a(z)) \, q(z, H) \, {\rm d}z
    code: plant::FF16_Model::assimilation_deep_crown
    also: [plant::FF16_Model::assimilation, plant::FF16_Model::assimilation_average_light, plant::FF16_Model::assimilation_crown_top, plant::ResourceSpline::crown_integral]
    reads: [FF16.a_p1, FF16.a_p2, FF16.eta]
    writes: []
    kind: integrator
    cite: Falster-2011
    overstorey: theory/models/ff16.qmd
    note: 'The code returns the whole-plant assimilation $A_{\rm l} \, \bar{p}$, the product the page writes inside the net production. This is the default (deep-crown) shading model, a Gauss-Kronrod rule over the unit crown. Control shading_model can replace it: mean-light takes $p$ of the leaf-weighted mean openness, $p(x, \int_0^H E_a(z) \, q(z, H) \, {\rm d}z)$; crown-centre, flat-top-box, flat-top-soft-box and PPA take $p(x, E_a(\eta_{\rm c} H))$, differing only in how the light profile is built.'
  FF16.respiration:
    model: FF16
    section: ff16_production
    title: Maintenance respiration
    latex: |
      \textrm{respiration} = \sum_{i = {\rm l}, {\rm b}, {\rm s}, {\rm r}, {\rm cr}}{M_i \, r_i}
    code: plant::FF16_Model::respiration
    also: [plant::ff16_respiration]
    reads: [FF16.r_l, FF16.r_b, FF16.r_s, FF16.r_r, FF16.r_cr]
    writes: []
    kind: closed_form
    cite: Falster-2011
    overstorey: theory/models/ff16.qmd
    note: 'The respiration term of the page''s net production. The code adds coarse roots (cr), which the page omits; the term is zero at the default $\alpha_{\rm cr1} = 0$.'
  FF16.turnover:
    model: FF16
    section: ff16_production
    title: Tissue turnover
    latex: |
      \textrm{turnover} = \sum_{i = {\rm l}, {\rm b}, {\rm s},  {\rm r}, {\rm cr}}{M_i \, k_i}
    code: plant::FF16_Model::turnover
    also: [plant::ff16_turnover, plant::FF16_Model::turnover_sapwood]
    reads: [FF16.k_l, FF16.k_b, FF16.k_s, FF16.k_r, FF16.k_cr]
    writes: []
    kind: closed_form
    cite: Falster-2011
    overstorey: theory/models/ff16.qmd
    note: 'The turnover term of the page''s net production. The code adds coarse roots (cr), which the page omits; the term is zero at the default $\alpha_{\rm cr1} = 0$.'
  FF16.net_production:
    model: FF16
    section: ff16_production
    title: Net biomass production
    latex: |
      \underbrace{\strut \frac{{\rm d}B}{{\rm d}t}}_\textrm{net biomass production}
      = \underbrace{\strut \alpha_{\rm bio} }_\textrm{mass per C} \,
      \underbrace{\strut \alpha_{\rm y} }_\textrm{yield}
      \big( \underbrace{\strut A_{\rm l} \, \bar{p}}_\textrm{photosynthesis} -
      \underbrace{\strut \, \sum_{i = {\rm l}, {\rm b}, {\rm s}, {\rm r}, {\rm cr}}{M_i \, r_i}}_\textrm{respiration}\big)
      - \underbrace{\strut \sum_{i = {\rm l}, {\rm b}, {\rm s},  {\rm r}, {\rm cr}}{M_i \, k_i}}_\textrm{turnover}
    code: plant::FF16_Model::net_mass_production_dt
    also: [plant::FF16_Model::net_mass_production_dt_A, plant::ff16_net_production_A]
    reads: [FF16.a_bio, FF16.a_y]
    writes: []
    kind: closed_form
    cite: Falster-2011
    overstorey: theory/models/ff16.qmd
    note: 'The page''s sums run over l, b, s and r; the code''s also include coarse roots (cr), zero at the default $\alpha_{\rm cr1} = 0$. Stored on the individual as the auxiliary net_mass_production_dt.'

  # --- FF16: allocation and growth --------------------------------------------------
  FF16.allocation:
    model: FF16
    section: ff16_growth
    title: Allocation to growth
    latex: |
      \frac{{\rm d}M_{\rm a}}{{\rm d}B}(H) = 1 -
      \frac{\alpha_{{\rm f1}}} {1 + \exp\left(\alpha_{{\rm f2}} \left(1 - H / H_{\rm mat}\right)\right)}
    code: plant::FF16_Model::fraction_allocation_reproduction
    also: [plant::FF16_Model::compute_rates]
    reads: [FF16.a_f1, FF16.a_f2, FF16.hmat]
    writes: []
    kind: closed_form
    cite: Falster-2011
    overstorey: theory/models/ff16.qmd
    note: 'fraction_allocation_reproduction evaluates the subtracted logistic, the fraction allocated to reproduction; compute_rates takes one minus it.'
  FF16.leaf_area_cost:
    model: FF16
    section: ff16_growth
    title: Leaf area per unit of live mass
    latex: |
      \frac{{\rm d}A_{\rm l}}{{\rm d}M_{\rm a}}
      = \bigg( \frac{{\rm d}M_{\rm l}}{{\rm d}A_{\rm l}} + \frac{{\rm d}M_{\rm s}}{{\rm d}A_{\rm l}} + \frac{{\rm d}M_{\rm b}}{{\rm d}A_{\rm l}} + \frac{{\rm d}M_{\rm r}}{{\rm d}A_{\rm l}} + \frac{{\rm d}M_{\rm cr}}{{\rm d}A_{\rm l}}\bigg)^{-1}
    code: plant::FF16_Model::darea_leaf_dmass_live
    reads: [FF16.lma, FF16.a_b1, FF16.a_r1, FF16.a_cr1]
    writes: []
    kind: closed_form
    cite: Falster-2011
    overstorey: theory/models/ff16.qmd
    note: 'The code adds the coarse-root cost ${\rm d}M_{\rm cr}/{\rm d}A_{\rm l}$, which the page omits; zero at the default $\alpha_{\rm cr1} = 0$.'
  FF16.tissue_costs:
    model: FF16
    section: ff16_growth
    title: Marginal tissue costs of leaf area
    latex: |
      \frac{{\rm d}M_{\rm l}}{{\rm d}A_{\rm l}} = \phi, \qquad
      \frac{{\rm d}M_{\rm s}}{{\rm d}A_{\rm l}} = \rho \, \theta \, \eta_{\rm c} \, \big(H + A_{\rm l} \, \frac{{\rm d}H}{{\rm d}A_{\rm l}} \big), \qquad
      \frac{{\rm d}M_{\rm b}}{{\rm d}A_{\rm l}} = \alpha_{{\rm b1}} \, \rho \, \theta \, \eta_{\rm c}\big(H + A_{\rm l} \, \frac{{\rm d}H}{{\rm d}A_{\rm l}} \big), \qquad
      \frac{{\rm d}M_{\rm r}}{{\rm d}A_{\rm l}} = \alpha_{{\rm r1}}, \qquad
      \frac{{\rm d}M_{\rm cr}}{{\rm d}A_{\rm l}} = \alpha_{{\rm cr1}} \, \frac{{\rm d}M_{\rm s}}{{\rm d}A_{\rm l}}
    code: plant::FF16_Model::dmass_sapwood_darea_leaf
    also: [plant::FF16_Model::dmass_leaf_darea_leaf, plant::FF16_Model::dmass_bark_darea_leaf, plant::FF16_Model::dmass_root_darea_leaf, plant::FF16_Model::dmass_coarse_root_darea_leaf]
    reads: [FF16.lma, FF16.rho, FF16.theta, FF16.eta, FF16.a_l1, FF16.a_l2, FF16.a_b1, FF16.a_r1, FF16.a_cr1]
    writes: []
    kind: closed_form
    overstorey: theory/models/ff16.qmd
    note: 'From the page''s allometry table (tbl-allometry). The code writes the sapwood cost as $\rho \, \eta_{\rm c} \, \alpha_{\rm l1} \, \theta \, (\alpha_{\rm l2} + 1) A_{\rm l}^{\alpha_{\rm l2}}$, the same number, since $A_{\rm l} \, {\rm d}H/{\rm d}A_{\rm l} = \alpha_{\rm l2} H$.'
  FF16.height_leaf_area_slope:
    model: FF16
    section: ff16_growth
    title: Height gained per unit leaf area
    latex: |
      \frac{{\rm d}H}{{\rm d}A_{\rm l}} = \alpha_{{\rm l2}} \alpha_{{\rm l1}} \left(A_{\rm l} \, {\rm m^{-2}} \right)^{\alpha_{{\rm l2}}-1}
    code: plant::FF16_Model::dheight_darea_leaf
    also: [plant::FF16_Model::darea_leaf_dheight]
    reads: [FF16.a_l1, FF16.a_l2]
    writes: []
    kind: closed_form
    overstorey: theory/models/ff16.qmd
    note: 'From the page''s allometry table (tbl-allometry).'
  FF16.height_growth:
    model: FF16
    section: ff16_growth
    title: Height growth rate
    latex: |
      g(x, H, E_{a}) = \frac{{\rm d}H}{{\rm d}t} = \frac{{\rm d}H}{{\rm d}A_{\rm l}}
      \times \frac{{\rm d}A_{\rm l} }{{\rm d}M_{\rm a}}
      \times \frac{{\rm d}M_{\rm a}}{{\rm d}B}
      \times \frac{{\rm d}B}{{\rm d}t}
    code: plant::FF16_Model::compute_rates
    also: [plant::FF16_Model::dheight_darea_leaf, plant::FF16_Model::darea_leaf_dmass_live, plant::FF16_Model::fraction_allocation_reproduction, plant::FF16_Model::net_mass_production_dt]
    reads: [FF16.a_l1, FF16.a_l2, FF16.a_f1, FF16.a_f2, FF16.hmat]
    writes: []
    kind: derivative
    fills: g
    cite: Falster-2011
    overstorey: theory/models/ff16.qmd
    note: 'Zero wherever ${\rm d}B/{\rm d}t \le 0$: the code sets the height, fecundity and heartwood rates to zero there, where the page''s product would be negative.'
  FF16.heartwood:
    model: FF16
    section: ff16_growth
    title: Heartwood formation
    latex: |
      \frac{{\rm d}A_{\rm h}}{{\rm d}t} = k_{\rm s} \, A_{\rm s}, \qquad \frac{{\rm d}M_{\rm h}}{{\rm d}t} = k_{\rm s} \, M_{\rm s}
    code: plant::FF16_Model::mass_heartwood_dt
    also: [plant::FF16_Model::compute_rates, plant::FF16_Model::turnover_sapwood]
    reads: [FF16.k_s]
    writes: []
    kind: derivative
    overstorey: theory/models/ff16.qmd
    note: 'The page uses ${\rm d}A_{\rm h}/{\rm d}t$ (eq-dast) without defining it. Sapwood turned over becomes heartwood, carried as the states area_heartwood and mass_heartwood. Both rates are zero wherever ${\rm d}B/{\rm d}t \le 0$, though sapwood turnover is still charged in the net production.'
  FF16.stem:
    model: FF16
    section: ff16_growth
    title: Stem basal area and diameter
    latex: |
      A_{\rm st} = A_{\rm b} + A_{\rm s} + A_{\rm h}, \qquad D = \left(\frac{4 A_{\rm st}}{\pi}\right)^{0.5}
    code: plant::FF16_Model::area_stem
    also: [plant::FF16_Model::diameter_stem]
    reads: [FF16.theta, FF16.a_b1]
    writes: []
    kind: closed_form
    overstorey: theory/models/ff16.qmd
    note: 'The page writes the rates (eq-dA-dst, eq-dast, eq-dDdt); the code carries $A_{\rm h}$ as a state and evaluates $A_{\rm st}$ and $D$ themselves, of which the page''s rates are the time derivatives. $A_{\rm st}$ is a census metric; $D$ is reported only.'
  FF16.asymptotic_height:
    model: FF16
    section: ff16_growth
    title: Height at which reproduction takes nearly all it can
    latex: |
      H_{\rm abs}(\epsilon_{\rm abs}) = H_{\rm mat} \left(1 + \frac{1}{\alpha_{{\rm f2}}} \ln \frac{1 - \epsilon_{\rm abs}}{\epsilon_{\rm abs}}\right)
    code: plant::FF16_Model::asymptotic_height
    reads: [FF16.hmat, FF16.a_f2]
    writes: []
    kind: closed_form
    note: 'Not on an Overstorey page. The inverse of the allocation logistic: above it reproduction takes at least $(1 - \epsilon_{\rm abs}) \alpha_{\rm f1}$. Where the continuous patch''s absorbing top layer sits (Control absorb_epsilon); NaN where $\alpha_{\rm f2} \le 0$ or $H_{\rm mat} \le 0$.'

  # --- FF16: allometry --------------------------------------------------------------
  FF16.leaf_area:
    model: FF16
    section: ff16_allometry
    title: Leaf area and height
    latex: |
      H = \alpha_{{\rm l1}} \, \left(A_{\rm l} \, {\rm m^{-2}}\right)^{\alpha_{{\rm l2}}}
    code: plant::FF16_Model::area_leaf
    also: [plant::ff16_area_leaf, plant::FF16_Model::height_given_mass_leaf]
    reads: [FF16.a_l1, FF16.a_l2]
    writes: []
    kind: closed_form
    fills: A_l
    cite: Falster-2011
    overstorey: theory/models/ff16.qmd
    note: 'The code evaluates the inverse, $A_{\rm l} = (H / \alpha_{\rm l1})^{1/\alpha_{\rm l2}}$; it is cached as the auxiliary competition_effect.'
  FF16.leaf_mass:
    model: FF16
    section: ff16_allometry
    title: Leaf mass
    latex: |
      M_{\rm l} = \phi \, A_{\rm l}
    code: plant::FF16_Model::mass_leaf
    reads: [FF16.lma]
    writes: []
    kind: closed_form
    overstorey: theory/models/ff16.qmd
    note: 'From the page''s allometry table (tbl-allometry); the text writes $A_{\rm l} = M_{\rm l} / \phi$.'
  FF16.sapwood_area:
    model: FF16
    section: ff16_allometry
    title: Sapwood area (the pipe model)
    latex: |
      A_{\rm s} = \theta \, A_{\rm l}
    code: plant::FF16_Model::area_sapwood
    reads: [FF16.theta]
    writes: []
    kind: closed_form
    cite: Falster-2011
    overstorey: theory/models/ff16.qmd
  FF16.sapwood_mass:
    model: FF16
    section: ff16_allometry
    title: Sapwood mass
    latex: |
      M_{\rm s}  = \rho \int_0^H A_{{\rm s},z} \, {\rm d}z = \rho A_{\rm s} H \eta_{\rm c}
    code: plant::FF16_Model::mass_sapwood
    also: [plant::CanopyShape::eta_c]
    reads: [FF16.rho, FF16.eta]
    writes: []
    kind: closed_form
    cite: Yokozawa-1995
    overstorey: theory/models/ff16.qmd
    note: '$\eta_{\rm c}$ is the shared crown_centre, computed once in prepare_strategy. With the pipe model this is $\rho \, \eta_{\rm c} \, \theta \, A_{\rm l} \, H$ (eq-ms2).'
  FF16.bark_area:
    model: FF16
    section: ff16_allometry
    title: Bark area
    latex: |
      A_{\rm b} = \alpha_{{\rm b1}} \, \theta \, A_{\rm l}
    code: plant::FF16_Model::area_bark
    reads: [FF16.a_b1, FF16.theta]
    writes: []
    kind: closed_form
    overstorey: theory/models/ff16.qmd
    note: 'From the page''s allometry table (tbl-allometry).'
  FF16.bark_mass:
    model: FF16
    section: ff16_allometry
    title: Bark mass
    latex: |
      M_{\rm b} = \alpha_{{\rm b1}} M_{\rm s}
    code: plant::FF16_Model::mass_bark
    reads: [FF16.a_b1, FF16.rho, FF16.theta, FF16.eta]
    writes: []
    kind: closed_form
    overstorey: theory/models/ff16.qmd
    note: 'The code forms it as $\rho \, A_{\rm b} \, H \, \eta_{\rm c}$, the same number.'
  FF16.root_mass:
    model: FF16
    section: ff16_allometry
    title: Fine-root mass
    latex: |
      M_{\rm r} = \alpha_{{\rm r1}} \, A_{\rm l}
    code: plant::FF16_Model::mass_root
    reads: [FF16.a_r1]
    writes: []
    kind: closed_form
    overstorey: theory/models/ff16.qmd
  FF16.coarse_root_mass:
    model: FF16
    section: ff16_allometry
    title: Coarse-root mass
    latex: |
      M_{\rm cr} = \alpha_{{\rm cr1}} \, M_{\rm s}
    code: plant::FF16_Model::mass_coarse_root
    reads: [FF16.a_cr1]
    writes: []
    kind: closed_form
    overstorey: theory/models/ff16.qmd
    note: 'From the page''s allometry table (tbl-allometry); the page''s text and equations otherwise leave coarse roots out. Zero at the default $\alpha_{\rm cr1} = 0$.'
  FF16.live_mass:
    model: FF16
    section: ff16_allometry
    title: Live mass
    latex: |
      M_{\rm a}=M_{\rm l}+M_{\rm b}+M_{\rm s}+M_{\rm r}+M_{\rm cr}
    code: plant::FF16_Model::mass_live
    also: [plant::FF16_Model::mass_live_given_height]
    reads: [FF16.a_cr1]
    writes: []
    kind: identity
    overstorey: theory/models/ff16.qmd
    note: 'The page''s $M_{\rm a}$ omits coarse roots; the code adds them (zero at the default $\alpha_{\rm cr1} = 0$).'
  FF16.total_mass:
    model: FF16
    section: ff16_allometry
    title: Total and above-ground mass
    latex: |
      M_{\rm tot} = M_{\rm l} + M_{\rm b} + M_{\rm s} + M_{\rm h} + M_{\rm r} + M_{\rm cr}, \qquad M_{\rm ag} = M_{\rm l} + M_{\rm b} + M_{\rm s} + M_{\rm h}
    code: plant::FF16_Model::mass_total
    also: [plant::FF16_Model::mass_above_ground]
    reads: []
    writes: []
    kind: identity
    note: 'Not on an Overstorey page. Reported only; $M_{\rm ag}$ is a census metric. Heartwood $M_{\rm h}$ is the integrated state, not an allometry.'

  # --- FF16: fecundity --------------------------------------------------------------
  FF16.fecundity:
    model: FF16
    section: ff16_fecundity
    title: Seed production
    latex: |
      f(x, H, E_{a}) = \frac{(1 - \frac{{\rm d}M_{\rm a}}{{\rm d}B}) \times \frac{{\rm d}B}{{\rm d}t}}{
      \omega + \alpha_{{\rm f3}}}
    code: plant::FF16_Model::fecundity_dt
    also: [plant::FF16_Model::compute_rates, plant::FF16_Model::fraction_allocation_reproduction]
    reads: [FF16.omega, FF16.a_f3, FF16.a_f1, FF16.a_f2, FF16.hmat]
    writes: []
    kind: closed_form
    fills: f
    cite: Falster-2011
    overstorey: theory/models/ff16.qmd
    note: 'Zero wherever ${\rm d}B/{\rm d}t \le 0$ (compute_rates), where the page''s expression would be negative.'

  # --- FF16: mortality and establishment ---------------------------------------------
  FF16.mortality:
    model: FF16
    section: ff16_mortality
    title: Mortality rate
    latex: |
      d(x, H, E_{a}) = d_{{\rm I}}(x, H) + d_{{\rm G}}(x, H, E_{a})
    code: plant::FF16_Model::mortality_dt
    also: [plant::FF16_Model::compute_rates, plant::mortality_hazard_live]
    reads: [FF16.d_I, FF16.a_dG1, FF16.a_dG2]
    writes: []
    kind: closed_form
    fills: d
    cite: Falster-2011
    overstorey: theory/models/ff16.qmd
    note: 'Held at zero once the cumulative hazard is non-finite or at the establishment-failure sentinel (mortality_hazard_live), where survival is already zero.'
  FF16.mortality_intrinsic:
    model: FF16
    section: ff16_mortality
    title: Growth-independent mortality
    latex: |
      d_{{\rm I}}(x, H) = d_{\rm I}
    code: plant::FF16_Model::mortality_growth_independent_dt
    reads: [FF16.d_I]
    writes: []
    kind: identity
    overstorey: theory/models/ff16.qmd
    note: 'Constant in size and light. Varies among strategies only through the trade-off from wood density (eq-di), which sets the parameter.'
  FF16.mortality_growth:
    model: FF16
    section: ff16_mortality
    title: Growth-dependent mortality
    latex: |
      d_{{\rm G}}(x, H, E_{a}) = \alpha_{{\rm dG1}} \exp(-\alpha_{{\rm dG2}} X), \qquad X=({\rm d}B/{\rm d}t)/A_{\rm l}
    code: plant::FF16_Model::mortality_growth_dependent_dt
    reads: [FF16.a_dG1, FF16.a_dG2]
    writes: []
    kind: closed_form
    cite: Falster-2011
    overstorey: theory/models/ff16.qmd
    note: '$X$ may be negative, which raises $d_{\rm G}$ above $\alpha_{\rm dG1}$.'
  FF16.establishment:
    model: FF16
    section: ff16_mortality
    title: Establishment probability
    latex: |
      S_{\rm G} (x^\prime, H_0, E_{{\rm a}0}) = \frac{\exp(-\kappa_{\rm G} \, a_0)}{1 + X^2}, \qquad X = \alpha_{{\rm d0}} \frac{A_{\rm l}}{{\rm d}B / {\rm d}t}
    code: plant::FF16_Model::establishment_probability
    also: [plant::FF16_Model::seed_geometry, plant::FF16_Model::net_mass_production_dt]
    reads: [FF16.a_d0, FF16.recruitment_decay, H_0]
    writes: []
    kind: closed_form
    fills: S_G
    cite: Falster-2011
    overstorey: theory/models/ff16.qmd
    note: 'The page writes $1 / (1 + X^2)$; the code multiplies by $\exp(-\kappa_{\rm G} a_0)$, the patch age at birth (recruitment_decay, 1 at its default of 0), and returns 0 where ${\rm d}B/{\rm d}t \le 0$. $A_{\rm l}$ and ${\rm d}B/{\rm d}t$ are the seed''s, at $H_0$ in the birth light environment.'

  # --- FF16: birth size, competition, census ---------------------------------------
  FF16.seed_height:
    model: FF16
    section: ff16_competition
    title: Height at birth
    latex: |
      M_{\rm a}(H_0) = \omega
    code: plant::FF16_Model::height_seed
    also: [plant::FF16_Model::prepare_strategy, plant::FF16_Model::mass_live_given_height, plant::FF16_Model::seed_geometry, plant::FF16_Model::set_initial_states, plant::FF16_Model::initial_height]
    reads: [FF16.omega, FF16.lma, FF16.rho, FF16.theta, FF16.eta, FF16.a_l1, FF16.a_l2, FF16.a_b1, FF16.a_r1, FF16.a_cr1]
    writes: []
    kind: closed_form
    fills: H_0
    overstorey: theory/models/ff16.qmd
    note: 'The page says only that seed mass determines the initial height. The live mass of the newborn (coarse roots included, no heartwood) equals the seed mass; prepare_strategy solves it by bisection, and on an active scalar seed_geometry declares the same residual through implicit_value, so $H_0$ carries the traits'' derivatives.'
  FF16.competition:
    model: FF16
    section: ff16_competition
    title: FF16's competition contribution
    latex: |
      \textrm{competition}(z, H) = k_{\rm I} \, A_{\rm l}(H) \, Q(z, H)
    code: plant::FF16_Model::compute_competition
    also: [plant::FF16_Model::compute_competition_by_ratio, plant::FF16_Model::compute_competition_and_slope]
    reads: [FF16.k_I, A_l, Q]
    writes: []
    kind: closed_form
    overstorey: theory/size-structured-pde.qmd
    note: 'The integrand of canopy_openness for one plant. Under the flat-top-box shading models CanopyShape replaces $Q$ by a step at the crown centre.'
  FF16.census:
    model: FF16
    section: ff16_competition
    title: FF16's census metrics
    latex: |
      w \in \left\{ A_{\rm l}(H), \; M_{\rm l} + M_{\rm b} + M_{\rm s} + M_{\rm h}, \; A_{\rm b} + A_{\rm s} + A_{\rm h} \right\}
    code: plant::FF16_Model::census_metrics
    also: [plant::FF16_Model::area_leaf, plant::FF16_Model::mass_above_ground, plant::FF16_Model::area_stem]
    reads: [FF16.a_l1, FF16.a_l2]
    writes: []
    kind: identity
    fills: w
    note: 'Not on an Overstorey page. Reported as leaf_area, mass_above_ground and area_stem, in that order.'

  # --- K93 -------------------------------------------------------------------------
  K93.growth:
    model: K93
    section: k93_growth
    title: Diameter growth
    latex: |
      G(t, a, x) = \max\Bigg(0, \; x \cdot \Bigg(b_0 - b_1 \cdot \ln{x} - b_2 \cdot B(t, a, x)\Bigg)\Bigg)
    code: plant::K93_Model::size_dt
    also: [plant::K93_Model::compute_rates]
    reads: [K93.b_0, K93.b_1, K93.b_2]
    writes: []
    kind: closed_form
    fills: g
    cite: Kohyama-1993
    overstorey: theory/models/k93.qmd
    note: 'Eq. 10 of Kohyama-1993, which the page writes without the floor; the code clamps negative growth to zero. $x$ is diameter at breast height in cm, carried on the generic height state, so $G$ is in cm yr⁻¹.'
  K93.fecundity:
    model: K93
    section: k93_fecundity
    title: Fecundity
    latex: |
      R(t, a, x) = d_0 \cdot B_0 \cdot \exp{(-d_1 \cdot B(t, a, x))}
    code: plant::K93_Model::fecundity_dt
    also: [plant::K93_Model::size_to_basal_area, plant::K93_Model::compute_rates]
    reads: [K93.d_0, K93.d_1, A_l]
    writes: []
    kind: closed_form
    fills: f
    cite: Kohyama-1993
    overstorey: theory/models/k93.qmd
    note: 'The page (Eq. 12) writes $R(t, a, x_0)$ with the suppression $B(t, a, x_0)$; the code evaluates both at the parent''s own diameter $x$, with $B_0$ its basal area (K93.basal_area).'
  K93.mortality:
    model: K93
    section: k93_mortality
    title: Mortality
    latex: |
      \mu(t, a, x) = \max\left(0, \; - c_0 + c_1 \cdot B(t, a, x)\right)
    code: plant::K93_Model::mortality_dt
    also: [plant::K93_Model::compute_rates, plant::mortality_hazard_live]
    reads: [K93.c_0, K93.c_1]
    writes: []
    kind: closed_form
    fills: d
    cite: Kohyama-1993
    overstorey: theory/models/k93.qmd
    note: 'Eq. 11; the page states the floor at zero in its text, not its equation. At the defaults it is zero until $B > c_0 / c_1$. Held at zero once the cumulative hazard is non-finite or at the establishment-failure sentinel. Competition-independent mortality is the patch disturbance regime.'
  K93.basal_area:
    model: K93
    section: k93_competition
    title: Basal area of one tree
    latex: |
      B_0 = \frac{\pi}{4} x^2
    code: plant::K93_Model::size_to_basal_area
    reads: []
    writes: []
    kind: closed_form
    fills: A_l
    overstorey: theory/models/k93.qmd
    note: 'The page interprets $B_0$ as one individual''s basal area and computes it this way in its example. K93 has no leaf area: basal area takes the place of $A_{\rm l}$ in the competition contribution, in cm² (the slot''s units say so).'
  K93.basal_area_above:
    model: K93
    section: k93_competition
    title: Basal area of larger trees
    latex: |
      B(t, a, x) = - \frac{\ln E_a(x)}{k_{\rm I}} = \frac{\pi}{4 \cdot A_{\rm P}} \int_{x}^{x_{max}} y^2 \cdot Q(x, y) \cdot f(t, a, y) \, dy
    code: plant::K93_Model::compute_rates
    also: [plant::K93_Model::compute_competition, plant::build_extinction_field]
    reads: [K93.k_I, K93.eta, Q, patch_area]
    writes: []
    kind: integrator
    cite: Kohyama-1993
    overstorey: theory/models/k93.qmd
    note: 'Eq. 8 of Kohyama-1993 writes $\frac{\pi}{4 \cdot s(t, a)} \int_{x}^{x_{max}} y^2 \cdot f(t, a, y) \, dy$. The code builds the shared environment $E_a = \exp(-k_{\rm I} B)$ from every species'' contributions and back-transforms it, so each larger tree is weighted by $Q(x, y)$ (the smoothing $\eta$; 1 in the page''s limit $\eta \to \infty$), the page''s $s(t, a)$ is the patch area $A_{\rm P}$, and $k_{\rm I}$ cancels when every species shares it (otherwise it weights each species, as K93.k_I says). The focal tree''s own basal area is not counted ($Q(x, x) = 0$). $f$ is the page''s size density, not the fecundity slot. The run stops if $B$ is not finite.'
  K93.competition:
    model: K93
    section: k93_competition
    title: K93's competition contribution
    latex: |
      \textrm{competition}(z, x) = k_{\rm I} \, B_0 \, Q(z, x)
    code: plant::K93_Model::compute_competition
    also: [plant::K93_Model::compute_competition_by_ratio, plant::K93_Model::compute_competition_and_slope, plant::K93_Model::update_dependent_aux]
    reads: [K93.k_I, A_l, Q]
    writes: []
    kind: closed_form
    note: 'Not on an Overstorey page as such: the integrand of canopy_openness for one tree, whose integral is $k_{\rm I} B$. $k_{\rm I} B_0$ is cached as the auxiliary competition_effect.'
  K93.establishment:
    model: K93
    section: k93_establishment
    title: Establishment
    latex: |
      S_{\rm G} (x^\prime, H_0, E_{{\rm a}0}) = 1
    code: plant::K93_Model::establishment_probability
    reads: []
    writes: []
    kind: identity
    fills: S_G
    overstorey: theory/models/k93.qmd
    note: 'Establishment is not part of Kohyama-1993, so every dispersed offspring establishes. Not gated on positive growth, unlike FF16: a recruit that cannot grow is filtered by the $g > 0$ inflow guard (density_boundary_height) instead.'

  # --- TF24: allometry ---------------------------------------------------------------
  TF24.leaf_area:
    model: TF24
    section: tf24_allometry
    title: Leaf area carried, and height
    latex: |
      A_{\rm l} = A_{\rm l}^{*}(H) \, e^{\delta_{\rm l}}, \qquad H = \alpha_{{\rm l1}} \, \left(A_{\rm l}^{*} \, {\rm m^{-2}}\right)^{\alpha_{{\rm l2}}}
    code: plant::TF24_Model::area_leaf_carried
    also: [plant::TF24_Model::area_leaf, plant::TF24_Model::update_dependent_aux, plant::TF24_Model::height_given_mass_leaf]
    reads: [TF24.a_l1, TF24.a_l2]
    writes: []
    kind: closed_form
    fills: A_l
    note: '$A_{\rm l}^{*}(H)$ is the leaf area a plant of height $H$ has on its allometry; $\delta_{\rm l} \le 0$ is the leaf departure state, the log of the canopy it has thinned to, zero unless flexible allometry is on ($\alpha_{\rm pl0} > 0$). Competition, assimilation and the census read the carried $A_{\rm l}$, kept in the competition_effect auxiliary; the allometric derivatives of growth read $A_{\rm l}^{*}(H)$.'
  TF24.leaf_mass:
    model: TF24
    section: tf24_allometry
    title: Leaf mass
    latex: |
      M_{\rm l} = \phi \, A_{\rm l}
    code: plant::TF24_Model::mass_leaf
    reads: [TF24.lma]
    writes: []
    kind: closed_form
  TF24.sapwood_area:
    model: TF24
    section: tf24_allometry
    title: Sapwood area, at the Huber value carried
    latex: |
      A_{\rm s} = \theta \, e^{\delta_{\rm s}} \, A_{\rm l}
    code: plant::TF24_Model::area_sapwood
    also: [plant::TF24_Model::sapwood_per_leaf_area]
    reads: [TF24.theta]
    writes: []
    kind: closed_form
    note: '$\delta_{\rm s} \ge 0$ is the sapwood departure state, the log of the Huber value carried over $\theta$; zero unless flexible allometry or sapwood acclimation is on. The one-argument form, used at birth, is $\theta A_{\rm l}$.'
  TF24.sapwood_mass:
    model: TF24
    section: tf24_allometry
    title: Sapwood mass
    latex: |
      M_{\rm s} = \rho \, A_{\rm s} \, H \, \eta_{\rm c}
    code: plant::TF24_Model::mass_sapwood
    also: [plant::CanopyShape::eta_c]
    reads: [TF24.rho, TF24.eta]
    writes: []
    kind: closed_form
  TF24.bark_area:
    model: TF24
    section: tf24_allometry
    title: Bark area
    latex: |
      A_{\rm b} = \alpha_{{\rm b1}} \, \theta \, A_{\rm l}
    code: plant::TF24_Model::area_bark
    reads: [TF24.a_b1, TF24.theta]
    writes: []
    kind: closed_form
    note: 'Bark follows leaf area at the resting Huber value: it does not take up the sapwood departure.'
  TF24.bark_mass:
    model: TF24
    section: tf24_allometry
    title: Bark mass
    latex: |
      M_{\rm b} = \rho \, A_{\rm b} \, H \, \eta_{\rm c}
    code: plant::TF24_Model::mass_bark
    reads: [TF24.rho, TF24.eta]
    writes: []
    kind: closed_form
  TF24.root_mass:
    model: TF24
    section: tf24_allometry
    title: Fine-root mass
    latex: |
      M_{\rm r} = \alpha_{{\rm r1}} \, A_{\rm l}
    code: plant::TF24_Model::mass_root
    reads: [TF24.a_r1]
    writes: []
    kind: closed_form
  TF24.coarse_root_mass:
    model: TF24
    section: tf24_allometry
    title: Coarse-root mass
    latex: |
      M_{\rm cr} = \alpha_{{\rm cr1}} \, M_{\rm s}
    code: plant::TF24_Model::mass_coarse_root
    reads: [TF24.a_cr1]
    writes: []
    kind: closed_form
  TF24.live_mass:
    model: TF24
    section: tf24_allometry
    title: Live mass
    latex: |
      M_{\rm a}=M_{\rm l}+M_{\rm b}+M_{\rm s}+M_{\rm r}+M_{\rm cr}
    code: plant::TF24_Model::mass_live
    also: [plant::TF24_Model::mass_live_given_height]
    reads: []
    writes: []
    kind: identity
  TF24.total_mass:
    model: TF24
    section: tf24_allometry
    title: Total and above-ground mass
    latex: |
      M_{\rm tot} = M_{\rm l} + M_{\rm b} + M_{\rm s} + M_{\rm h} + M_{\rm r} + M_{\rm cr}, \qquad M_{\rm ag} = M_{\rm l} + M_{\rm b} + M_{\rm s} + M_{\rm h}
    code: plant::TF24_Model::mass_total
    also: [plant::TF24_Model::mass_above_ground]
    reads: []
    writes: []
    kind: identity
  TF24.stem:
    model: TF24
    section: tf24_allometry
    title: Stem basal area and diameter
    latex: |
      A_{\rm st} = A_{\rm b} + A_{\rm s} + A_{\rm h}, \qquad D = \left(\frac{4 A_{\rm st}}{\pi}\right)^{0.5}
    code: plant::TF24_Model::area_stem
    also: [plant::TF24_Model::diameter_stem]
    reads: []
    writes: []
    kind: closed_form

  # --- TF24: light and atmosphere ---------------------------------------------------
  TF24.light_chain:
    model: TF24
    section: tf24_light
    title: The light handed to the leaf
    latex: |
      Q_{\rm above} = \kappa_{\rm PAR} \, f_{\rm PAR} \, R_{\rm sw}, \qquad
      Q_{\rm int} = k_{\rm I} \, \max\!\big(E, 10^{-4}\big) \, Q_{\rm above}, \qquad
      Q_{\rm NIR} = \frac{1 - f_{\rm PAR}}{\kappa_{\rm PAR} \, f_{\rm PAR}} \, Q_{\rm int}
    code: plant::TF24_Model::net_mass_production_dt
    also: [plant::TF24_Model::solve_leaf_over_crown]
    reads: [TF24.k_I, TF24.f_PAR, TF24.SWdown, 'phylloptim:umol_par_per_joule', 'phylloptim:PPFD', 'phylloptim:NIR_int_']
    writes: []
    kind: closed_form
    note: '$E$ is the canopy openness the plant''s leaves stand in (TF24.crown_light). $Q_{\rm int}$ is photon flux intercepted per unit leaf area, the leaf''s PPFD; $Q_{\rm NIR}$ is the near-infrared it intercepts, read only with the energy balance on. Nothing upstream of the leaf absorbs: the leaf applies $\alpha_{\rm PAR}$ and $\alpha_{\rm NIR}$. Not on an Overstorey page.'
  TF24.crown_light:
    model: TF24
    section: tf24_light
    title: The light a crown is solved at
    latex: |
      E = \int_0^{H} \max\!\big(E(z), 10^{-4}\big) \, q(z, H) \, {\rm d}z \ \text{(mean light)}, \qquad
      E = E(\eta_{\rm c} H) \ \text{(crown centre)}, \qquad
      \bar{y} = \int_0^{H} y\big(E(z)\big) \, q(z, H) \, {\rm d}z \ \text{(deep crown)}
    code: plant::TF24_Model::solve_leaf_over_crown
    also: [plant::CanopyShape::q_from_height]
    reads: [TF24.eta]
    writes: []
    kind: integrator
    note: 'Chosen by Control''s shading_model; mean light is TF24''s default. Mean light and crown centre solve the leaf once; deep crown solves it at each quadrature node of the crown and integrates every leaf output $y$ (the carbon kept, transpiration, per-layer uptake, potentials, conductance, leaf temperature) against the crown''s leaf-area density $q$. Deep crown carries no gradient, and refuses sapwood acclimation. The flat-top and PPA models are refused.'

  # --- TF24: stem and root supply -----------------------------------------------------
  TF24.stem_path_length:
    model: TF24
    section: tf24_hydraulics
    title: Effective hydraulic path length
    latex: |
      L_{\rm eff} = L_{\rm tip} \, \frac{(L / L_{\rm tip})^{1 - \beta} - 1}{1 - \beta}, \qquad L = \eta_{\rm c} H, \qquad \beta = 2 D_{\rm c} + \theta_{\rm c}
    code: plant::stem_hydraulics::effective_path_length
    also: [plant::TF24_Model::stem_path_exponent]
    reads: [TF24.D_c, TF24.theta_c, TF24.L_tip, TF24.eta]
    writes: []
    kind: closed_form
    note: 'The stem''s resistance as a path integral from the base to the mean height of leaf area, with conductivity widening and the Huber value profiled from the terminal segment. At $\beta = 1$ it is $L_{\rm tip} \ln(L / L_{\rm tip})$; at $\beta = 0$ it is $L - L_{\rm tip}$, and with $L_{\rm tip} = 0$ as well, the height-linear $L$. Not on an Overstorey page.'
  TF24.leaf_specific_conductance:
    model: TF24
    section: tf24_hydraulics
    title: Leaf-specific stem conductance
    latex: |
      k_{\max} = \frac{K_{\rm s} \, \theta \, e^{\delta_{\rm s}}}{L_{\rm eff}}
    code: plant::TF24_Model::update_leaf_specific_conductance_max
    reads: [TF24.K_s, TF24.theta]
    writes: []
    kind: closed_form
    note: 'Handed to the leaf as its $k_{\max}$, so the stem''s supply per unit leaf area follows the Huber value the plant carries. Not on an Overstorey page.'
  TF24.root_profile:
    model: TF24
    section: tf24_hydraulics
    title: Fine roots over depth
    latex: |
      Q_{\rm r}(z) = \left(1 - \left(z / D_{\rm r}\right)^{\eta_{\rm r}}\right)^{2} \ \text{for } z \le D_{\rm r}, \ 0 \text{ below}, \qquad D_{\rm r} = \min(H, D_{\rm r,max})
    code: plant::TF24_Model::Q
    also: [plant::TF24_Model::build_root_network]
    reads: [TF24.root_depth_shape_eta, TF24.rooting_depth_max]
    writes: []
    kind: closed_form
    note: 'The crown profile''s cumulative form, laid over the soil: the fraction of fine-root mass deeper than $z$. Not on an Overstorey page.'
  TF24.root_carbon:
    model: TF24
    section: tf24_hydraulics
    title: Root carbon per leaf area in each soil layer
    latex: |
      C_i = s_{\rm r} \, \alpha_{\rm r1} \, \big( Q_{\rm r}(z_{i-1}) - Q_{\rm r}(z_i) \big), \qquad z_0 = 0
    code: plant::TF24_Model::build_root_network
    reads: [TF24.root_mass_carbon_scale, TF24.a_r1, TF24.beta_R_H, TF24.beta_R_V, 'phylloptim:root_network_from_carbon']
    writes: []
    kind: closed_form
    note: 'Per unit leaf area, because the leaf is intensive: $M_{\rm r} / A_{\rm l} = \alpha_{\rm r1}$. $z_i$ is the depth of the bottom of soil layer $i$. phylloptim''s root_network_from_carbon turns $C_i$ into the resistances the leaf''s supply reads, with layer thicknesses from phylloptim::layer_thicknesses. Not on an Overstorey page.'
  TF24.water_uptake:
    model: TF24
    section: tf24_hydraulics
    title: A plant's draw on each soil layer
    latex: |
      U_i = \frac{E_i \, A_{\rm l} \, \tau_{\rm d} \, M_{\rm w}}{10^{3}}, \qquad \tau_{\rm d} = 60 \cdot 60 \cdot 12 \cdot 365 \ {\rm s \, yr^{-1}}
    code: plant::TF24_Model::compute_rates
    also: [plant::TF24_Model::evapotranspiration_dt]
    reads: ['phylloptim:multilayer_uptake', 'phylloptim:kg_per_mol_h2o']
    writes: []
    kind: closed_form
    note: '$E_i$ is the leaf''s uptake from layer $i$ per unit leaf area at the operating point (mol H₂O m⁻² s⁻¹), so $U_i$ is m³ of water a year; the patch sums it over plants into the soil balance. $\tau_{\rm d}$ counts twelve hours of daylight a day. Not on an Overstorey page.'

  # --- TF24: assimilation, respiration and net production ------------------------------
  TF24.leaf_operating_point:
    model: TF24
    section: tf24_production
    title: The leaf's operating point and the carbon it keeps
    latex: |
      \Pi = A_{\rm kept}\big(\psi_{\rm r}^{*}\big), \qquad \psi_{\rm r}^{*} : \ \frac{{\rm d}J}{{\rm d}\psi_{\rm r}} = 0 \ \text{or a bound}, \quad \text{given } Q_{\rm int},\, Q_{\rm NIR},\, k_{\max},\, \{\psi_{{\rm s},i}\},\, \{C_i\}
    code: plant::TF24_Model::solve_leaf
    also: [plant::TF24_Model::seat_leaf, plant::TF24_Model::solve_leaf_over_crown]
    reads: ['phylloptim:carbon', 'phylloptim:foc_collar', 'phylloptim:collar_bracket', 'phylloptim:cost_TF24_floor', 'phylloptim:leaf_from_collar', 'phylloptim:multilayer_uptake']
    writes: []
    kind: closed_form
    overstorey: theory/assimilation-hydraulics.qmd
    note: 'phylloptim solves for the root-collar water potential that maximises the TF24_floor objective $J$, and returns the carbon the leaf kept, $\Pi$ in µmol m⁻² s⁻¹; every equation of the solve is phylloptim''s. Growth is billed $\Pi$, the objective with the shadow price of water added back, not the objective itself: the price changes the aperture chosen and costs no carbon. The soil potentials $\psi_{{\rm s},i}$ are the soil column''s. A run that recorded its operating points replays them instead of solving again.'
  TF24.assimilation:
    model: TF24
    section: tf24_production
    title: Whole-plant assimilation
    latex: |
      A = \Pi \, A_{\rm l} \, \tau_{\rm d} \, 10^{-6}
    code: plant::TF24_Model::net_mass_production_dt
    reads: ['phylloptim:carbon']
    writes: []
    kind: closed_form
    note: 'mol yr⁻¹, with $\tau_{\rm d}$ the seconds of daylight a year (TF24.water_uptake). Under deep-crown shading $\Pi$ is the crown mean. The auxiliary named assimilation is not this total: it is the leaf''s own assimilation per unit leaf area (assim_colimited_).'
  TF24.respiration:
    model: TF24
    section: tf24_production
    title: Maintenance respiration
    latex: |
      R = \sum_{i = {\rm l}, {\rm b}, {\rm s}, {\rm r}, {\rm cr}}{M_i \, r_i}
    code: plant::TF24_Model::respiration
    also: [plant::TF24_Model::respiration_leaf, plant::TF24_Model::respiration_sapwood]
    reads: [TF24.r_l, TF24.r_b, TF24.r_s, TF24.r_r, TF24.r_cr]
    writes: []
    kind: closed_form
    note: 'On the masses the plant carries: the sapwood at its departed Huber value, the leaf and fine root at the carried leaf area.'
  TF24.turnover:
    model: TF24
    section: tf24_production
    title: Tissue turnover charged
    latex: |
      T = u_{\rm l} \, k_{\rm l} M_{\rm l} + k_{\rm b} M_{\rm b} + u_{\rm s} \, k_{\rm s} M_{\rm s} + k_{\rm r} M_{\rm r} + k_{\rm cr} M_{\rm cr}
    code: plant::TF24_Model::turnover
    also: [plant::TF24_Model::turnover_leaf, plant::TF24_Model::turnover_sapwood]
    reads: [TF24.k_l, TF24.k_b, TF24.k_s, TF24.k_r, TF24.k_cr]
    writes: []
    kind: closed_form
    note: 'The turnover the plant pays to replace: $u_{\rm l}$ and $u_{\rm s}$ are the replaced fractions (TF24.replacement, TF24.sapwood_replacement), both 1 with flexible allometry off. Only leaf and sapwood, whose sizes are states, may go unreplaced; bark, fine and coarse roots are charged in full.'
  TF24.net_production:
    model: TF24
    section: tf24_production
    title: Net biomass production
    latex: |
      \frac{{\rm d}B}{{\rm d}t} = \alpha_{\rm bio} \, \alpha_{\rm y} \, (A - R) - T
    code: plant::TF24_Model::net_mass_production_dt
    also: [plant::TF24_Model::net_mass_production_dt_A]
    reads: [TF24.a_bio, TF24.a_y]
    writes: []
    kind: closed_form
    overstorey: theory/models/tf24.qmd
    note: 'The page names ${\rm d}B/{\rm d}t$ in the growth chain without writing it. Stored as the auxiliary net_mass_production_dt, which establishment reads for a newborn. Unlike FF16 no rate is cut at ${\rm d}B/{\rm d}t \le 0$: the storage pool takes the shortfall (TF24.growth_flux).'

  # --- TF24: the storage pool ---------------------------------------------------------
  TF24.storage_capacity:
    model: TF24
    section: tf24_storage
    title: Storage capacity and relative reserves
    latex: |
      S_{\max} = \alpha_{\rm st1} \, M_{\rm s}, \qquad r = S / S_{\max}
    code: plant::TF24_Model::storage_capacity
    also: [plant::TF24_Model::compute_rates]
    reads: [TF24.a_st1]
    writes: []
    kind: closed_form
    note: '$S$ is the storage state (kg); $r$ is taken as 0 where $S_{\max} = 0$, and read unclamped, the solver rejecting a step that leaves $S < 0$. The header follows Stefaniak et al. 2026 (plantNSC). Not on an Overstorey page.'
  TF24.growth_flux:
    model: TF24
    section: tf24_storage
    title: The growth flux the reserves release
    latex: |
      F = P_{+} \, G(r), \qquad P_{+} = \tfrac{1}{2}\Big(P + \sqrt{P^2 + \epsilon_{\rm P}^2}\Big), \qquad G(r) = \frac{1}{1 + \exp\!\big(-(r - \alpha_{\rm st2}) / w_{\rm G}\big)}, \qquad P = \frac{{\rm d}B}{{\rm d}t}
    code: plant::TF24_Model::compute_rates
    reads: [TF24.a_st2, TF24.storage_gate_width, TF24.storage_prod_eps]
    writes: []
    kind: closed_form
    note: 'Growth and reproduction are paid from $F$, not from ${\rm d}B/{\rm d}t$: production''s smooth positive part, released as reserves near capacity and withheld as they empty. Not on an Overstorey page.'
  TF24.storage_ode:
    model: TF24
    section: tf24_storage
    title: The storage pool
    latex: |
      \frac{{\rm d}S}{{\rm d}t} = \frac{c\,(1 - r) - d\,r}{1 + \tau_{\rm o} \, (c + d) / S_{\max}}, \qquad c = P_{+}\,(1 - G(r)), \qquad d = P_{+} - P
    code: plant::TF24_Model::compute_rates
    reads: [TF24.storage_relaxation_offset]
    writes: []
    kind: derivative
    note: 'The charge $c$ is the surplus the gate withheld and the drain $d$ the shortfall met from reserves; each is limited by the room the other leaves, so $S$ stays in $[0, S_{\max}]$ with no clamp. At capacity the withheld charge leaves the budget: the pool is capped by withholding, not by spending. The divisor is taken as 1 where $S_{\max} = 0$. Not on an Overstorey page.'
  TF24.storage_initial:
    model: TF24
    section: tf24_storage
    title: Reserves at birth
    latex: |
      S(t_0) = \alpha_{\rm st3} \, S_{\max}(H_0)
    code: plant::TF24_Model::set_initial_states
    reads: [TF24.a_st3, H_0]
    writes: []
    kind: closed_form
    note: 'Both departures start at zero, since a seed is on its allometry. The header cites Stefaniak et al. 2026, Eq. 8. Not on an Overstorey page.'

  # --- TF24: allocation and growth -----------------------------------------------------
  TF24.allocation:
    model: TF24
    section: tf24_growth
    title: Allocation to growth
    latex: |
      \frac{{\rm d}M_{\rm a}}{{\rm d}B}(H) = 1 -
      \frac{\alpha_{{\rm f1}}} {1 + \exp\left(\alpha_{{\rm f2}} \left(1 - H / H_{\rm mat}\right)\right)}
    code: plant::TF24_Model::fraction_allocation_growth
    also: [plant::TF24_Model::fraction_allocation_reproduction]
    reads: [TF24.a_f1, TF24.a_f2, TF24.hmat]
    writes: []
    kind: closed_form
  TF24.height_leaf_area_slope:
    model: TF24
    section: tf24_growth
    title: Height gained per unit leaf area
    latex: |
      \frac{{\rm d}H}{{\rm d}A_{\rm l}} = \alpha_{{\rm l2}} \alpha_{{\rm l1}} \left(A_{\rm l}^{*} \, {\rm m^{-2}} \right)^{\alpha_{{\rm l2}}-1}
    code: plant::TF24_Model::dheight_darea_leaf
    reads: [TF24.a_l1, TF24.a_l2]
    writes: []
    kind: closed_form
  TF24.tissue_costs:
    model: TF24
    section: tf24_growth
    title: Marginal tissue costs of leaf area
    latex: |
      \frac{{\rm d}M_{\rm l}}{{\rm d}A_{\rm l}} = \phi, \qquad
      \frac{{\rm d}M_{\rm s}}{{\rm d}A_{\rm l}} = \rho \, \theta \, e^{\delta_{\rm s}} \, \eta_{\rm c} \, \big(H + A_{\rm l}^{*} \, \frac{{\rm d}H}{{\rm d}A_{\rm l}} \big), \qquad
      \frac{{\rm d}M_{\rm b}}{{\rm d}A_{\rm l}} = \alpha_{{\rm b1}} \, \rho \, \theta \, \eta_{\rm c}\big(H + A_{\rm l}^{*} \, \frac{{\rm d}H}{{\rm d}A_{\rm l}} \big), \qquad
      \frac{{\rm d}M_{\rm r}}{{\rm d}A_{\rm l}} = \alpha_{{\rm r1}}, \qquad
      \frac{{\rm d}M_{\rm cr}}{{\rm d}A_{\rm l}} = \alpha_{{\rm cr1}} \, \frac{{\rm d}M_{\rm s}}{{\rm d}A_{\rm l}}
    code: plant::TF24_Model::dmass_sapwood_darea_leaf
    also: [plant::TF24_Model::dmass_leaf_darea_leaf, plant::TF24_Model::dmass_bark_darea_leaf, plant::TF24_Model::dmass_root_darea_leaf, plant::TF24_Model::dmass_coarse_root_darea_leaf]
    reads: [TF24.lma, TF24.rho, TF24.theta, TF24.eta, TF24.a_l1, TF24.a_l2, TF24.a_b1, TF24.a_r1, TF24.a_cr1]
    writes: []
    kind: closed_form
    note: 'Sapwood is priced at the Huber value the plant carries; bark at the resting one. The code writes $H + A_{\rm l}^{*}\,{\rm d}H/{\rm d}A_{\rm l}$ as $\alpha_{\rm l1} (\alpha_{\rm l2} + 1) A_{\rm l}^{*\,\alpha_{\rm l2}}$.'
  TF24.leaf_area_cost:
    model: TF24
    section: tf24_growth
    title: Leaf area per unit of live mass
    latex: |
      \frac{{\rm d}A_{\rm l}}{{\rm d}M_{\rm a}}
      = \bigg( \frac{{\rm d}M_{\rm l}}{{\rm d}A_{\rm l}} + \frac{{\rm d}M_{\rm s}}{{\rm d}A_{\rm l}} + \frac{{\rm d}M_{\rm b}}{{\rm d}A_{\rm l}} + \frac{{\rm d}M_{\rm r}}{{\rm d}A_{\rm l}} + \frac{{\rm d}M_{\rm cr}}{{\rm d}A_{\rm l}}\bigg)^{-1}
    code: plant::TF24_Model::darea_leaf_dmass_live
    reads: []
    writes: []
    kind: closed_form
  TF24.height_growth:
    model: TF24
    section: tf24_growth
    title: Height growth rate
    latex: |
      g(x, H, E_{a}) = \frac{{\rm d}H}{{\rm d}t} = \frac{{\rm d}H}{{\rm d}A_{\rm l}}
      \times \frac{{\rm d}A_{\rm l} }{{\rm d}M_{\rm a}}
      \times \frac{{\rm d}M_{\rm a}}{{\rm d}B}
      \times (1 - b) \, F
    code: plant::TF24_Model::compute_rates
    also: [plant::TF24_Model::dheight_darea_leaf, plant::TF24_Model::darea_leaf_dmass_live, plant::TF24_Model::fraction_allocation_growth]
    reads: [TF24.a_l1, TF24.a_l2, TF24.a_f1, TF24.a_f2, TF24.hmat]
    writes: []
    kind: derivative
    fills: g
    cite: Towers-2024
    overstorey: theory/models/tf24.qmd
    note: 'The page''s chain ends in ${\rm d}B/{\rm d}t$; the code''s ends in the growth flux $F$ the reserves release (TF24.growth_flux), less the share $b$ spent rebuilding a thinned canopy (TF24.rebuild_share), which buys leaf area and no height. The allometric derivatives are taken at $A_{\rm l}^{*}(H)$, the leaf area the height implies, so extension preserves the departures. Height cannot fall.'
  TF24.heartwood:
    model: TF24
    section: tf24_growth
    title: Heartwood formation
    latex: |
      \frac{{\rm d}A_{\rm h}}{{\rm d}t} = k_{\rm s} \, A_{\rm s}, \qquad \frac{{\rm d}M_{\rm h}}{{\rm d}t} = k_{\rm s} \, M_{\rm s}
    code: plant::TF24_Model::area_heartwood_dt
    also: [plant::TF24_Model::mass_heartwood_dt, plant::TF24_Model::compute_rates]
    reads: [TF24.k_s]
    writes: []
    kind: derivative
    note: 'On the sapwood carried, whatever the plant''s carbon: heartwood forms at the full turnover rate even where the budget is charged only $u_{\rm s} k_{\rm s} M_{\rm s}$ to replace it.'

  # --- TF24: flexible allometry and sapwood acclimation ------------------------------
  TF24.marginal_leaf_return:
    model: TF24
    section: tf24_plasticity
    title: The marginal leaf's return
    latex: |
      R_{\rm l} = \frac{\alpha_{\rm bio} \alpha_{\rm y} A - C_{\rm l}}{C_{\rm l}}, \qquad
      C_{\rm l} = \alpha_{\rm bio} \alpha_{\rm y} \big(r_{\rm l} M_{\rm l} + r_{\rm b} M_{\rm b} + r_{\rm r} M_{\rm r}\big) + k_{\rm l} M_{\rm l} + k_{\rm b} M_{\rm b} + k_{\rm r} M_{\rm r}
    code: plant::TF24_Model::update_marginal_leaf_return
    reads: [TF24.a_bio, TF24.a_y, TF24.r_l, TF24.r_b, TF24.r_r, TF24.k_l, TF24.k_b, TF24.k_r]
    writes: []
    kind: closed_form
    note: 'Zero at break-even, where a leaf stops covering its own upkeep (the header follows Manzoni et al. 2015). Only the costs that scale with leaf area count; sapwood is left out. Taken as 0 where $C_{\rm l} \le 0$, and stored as the auxiliary leaf_marginal_return. Not on an Overstorey page.'
  TF24.tracked_return:
    model: TF24
    section: tf24_plasticity
    title: The tracked marginal return
    latex: |
      \frac{{\rm d}\bar{R}_{\rm l}}{{\rm d}t} = \alpha_{\rm pl4} \big(R_{\rm l} - \bar{R}_{\rm l}\big)
    code: plant::TF24_Model::compute_rates
    also: [plant::TF24_Model::set_initial_states]
    reads: [TF24.a_pl4]
    writes: []
    kind: derivative
    note: 'A running mean, so the canopy answers to seasons rather than weather. At birth $\bar{R}_{\rm l}$ is the newborn''s own $R_{\rm l}$ where $\alpha_{\rm pl0} > 0$, and 0 otherwise, where it reaches no rate. Not on an Overstorey page.'
  TF24.replacement:
    model: TF24
    section: tf24_plasticity
    title: The fraction of leaf turnover replaced
    latex: |
      u_{\rm l} = 1 - \big(1 - \varrho(\bar{R}_{\rm l})\big)\, s(\delta_{\rm l}), \qquad
      \varrho(R) = 1 - \frac{\alpha_{\rm pl0}}{1 + \exp\!\big((R - \alpha_{\rm pl1}) / w_{\rm pl}\big)}, \qquad
      s(\delta_{\rm l}) = 1 - \exp\!\big((\ln \alpha_{\rm pl3} - \delta_{\rm l}) / \alpha_{\rm pl2}\big)
    code: plant::TF24_Model::net_mass_production_dt
    also: [plant::TF24_Model::replacement_fraction, plant::TF24_Model::shedding_gate]
    reads: [TF24.a_pl0, TF24.a_pl1, TF24.a_pl2, TF24.a_pl3, TF24.plasticity_gate_width]
    writes: []
    kind: closed_form
    note: 'Exactly 1 at $\alpha_{\rm pl0} = 0$, the fixed allometry. The taper $s$ stops shedding at the canopy floor, $\delta_{\rm l} = \ln \alpha_{\rm pl3}$, so the floor is a property of the flow rather than a clamp. Not on an Overstorey page.'
  TF24.sapwood_replacement:
    model: TF24
    section: tf24_plasticity
    title: The fraction of sapwood turnover replaced
    latex: |
      u_{\rm s} = u_{\rm l} \, \exp\!\big(-\delta_{\rm s} / \alpha_{\rm pl2}\big)
    code: plant::TF24_Model::sapwood_replacement_fraction
    reads: [TF24.a_pl2]
    writes: []
    kind: closed_form
    note: 'A stem carrying more conducting area than its canopy needs declines to renew the excess, which gives the Huber value its restoring force; $\delta_{\rm s} \ge 0$ holds while $k_{\rm l} > k_{\rm s}$. Not on an Overstorey page.'
  TF24.rebuild_share:
    model: TF24
    section: tf24_plasticity
    title: The share of growth spent rebuilding the canopy
    latex: |
      b = u_{\rm l} \big(1 - e^{\delta_{\rm l} / \alpha_{\rm pl2}}\big), \qquad
      m_A(H) = \phi + \alpha_{\rm r1} + \theta \, H \, \eta_{\rm c} \, \rho \, (1 + \alpha_{\rm b1})
    code: plant::TF24_Model::compute_rates
    also: [plant::TF24_Model::mass_live_per_area_leaf_at_height]
    reads: [TF24.a_pl2, TF24.lma, TF24.a_r1, TF24.theta, TF24.eta, TF24.rho, TF24.a_b1]
    writes: []
    kind: closed_form
    note: 'Zero when the canopy is whole ($\delta_{\rm l} = 0$), and gated by the same signal as replacement, so a plant rebuilds only as far as it is willing to maintain. $m_A$ is the mass of a unit of leaf area bought at unchanged height with its fine root, sapwood and bark, at the resting Huber value. Not on an Overstorey page.'
  TF24.leaf_departure_ode:
    model: TF24
    section: tf24_plasticity
    title: The leaf departure
    latex: |
      \frac{{\rm d}\delta_{\rm l}}{{\rm d}t} = \frac{b \, F \, \frac{{\rm d}M_{\rm a}}{{\rm d}B}}{m_A(H) \, A_{\rm l}} - (1 - u_{\rm l}) \, k_{\rm l}
    code: plant::TF24_Model::compute_rates
    reads: [TF24.k_l]
    writes: []
    kind: derivative
    note: 'Leaf area loses the turnover it did not replace and regains what rebuilding buys; it cannot thin faster than leaves turn over, nor rise above zero. Not on an Overstorey page.'
  TF24.sapwood_departure_ode:
    model: TF24
    section: tf24_plasticity
    title: The sapwood departure
    latex: |
      \frac{{\rm d}\delta_{\rm s}}{{\rm d}t} = (1 - u_{\rm l}) \, k_{\rm l} - (1 - u_{\rm s}) \, k_{\rm s} + \frac{b \, F \, \frac{{\rm d}M_{\rm a}}{{\rm d}B}}{m_A(H) \, A_{\rm l}} \big(e^{-\delta_{\rm s}} - 1\big) + \alpha_{\rm sw} R_{\rm s}
    code: plant::TF24_Model::compute_rates
    reads: [TF24.k_l, TF24.k_s, TF24.a_sw]
    writes: []
    kind: derivative
    note: 'The difference of leaf and sapwood losses, so a thinning canopy raises the Huber value; the rebuilding term is the geometry of adding leaf and sapwood at the ratio $\theta$. Not on an Overstorey page.'
  TF24.sapwood_marginal_return:
    model: TF24
    section: tf24_plasticity
    title: The marginal return of sapwood, in growth
    latex: |
      R_{\rm s} = \frac{F}{F + C} \cdot \frac{\partial_{\delta_{\rm s}} P - P \, \frac{{\rm d}M_{\rm s}}{{\rm d}A_{\rm l}} \, \frac{{\rm d}A_{\rm l}}{{\rm d}M_{\rm a}}}{C}, \qquad
      \partial_{\delta_{\rm s}} P = \alpha_{\rm bio} \alpha_{\rm y} A_{\rm l} \, \frac{\partial \Pi}{\partial k_{\max}} k_{\max} \, \tau_{\rm d} 10^{-6} - \alpha_{\rm bio} \alpha_{\rm y} r_{\rm s} M_{\rm s} - u_{\rm s} k_{\rm s} M_{\rm s} \Big(1 - \frac{1}{\alpha_{\rm pl2}}\Big), \qquad
      C = \alpha_{\rm bio} \alpha_{\rm y} R + T
    code: plant::TF24_Model::sapwood_marginal_return
    also: [plant::TF24_Model::measure_dprofit_dkmax]
    reads: [TF24.a_bio, TF24.a_y, TF24.r_s, TF24.k_s, TF24.a_pl2, 'phylloptim:carbon']
    writes: []
    kind: closed_form
    note: 'Zero unless $\alpha_{\rm sw} > 0$ and $C > 0$. $\partial \Pi / \partial k_{\max}$ is a forward difference at a relative step of $10^{-3}$, re-solving the leaf, so a run with sapwood acclimation on carries no gradient. The objective is growth, not production: the second term prices extra stem in forgone leaf area. Stored as the auxiliary sapwood_marginal_return. Not on an Overstorey page.'

  # --- TF24: seed production -----------------------------------------------------------
  TF24.fecundity:
    model: TF24
    section: tf24_fecundity
    title: Seed production
    latex: |
      f(x, H, E_{a}) = \frac{(1 - \frac{{\rm d}M_{\rm a}}{{\rm d}B}) \times F}{
      \omega + \alpha_{{\rm f3}}}
    code: plant::TF24_Model::fecundity_dt
    also: [plant::TF24_Model::compute_rates, plant::TF24_Model::fraction_allocation_reproduction]
    reads: [TF24.omega, TF24.a_f3, TF24.a_f1, TF24.a_f2, TF24.hmat]
    writes: []
    kind: closed_form
    fills: f
    note: 'Paid from the growth flux $F$, as height growth is, not from ${\rm d}B/{\rm d}t$. Not on an Overstorey page.'

  # --- TF24: mortality and establishment ----------------------------------------------
  TF24.mortality:
    model: TF24
    section: tf24_mortality
    title: Mortality rate
    latex: |
      d(x, H, E_{a}) = d_{{\rm I}} + d_{{\rm S}}(r)
    code: plant::TF24_Model::mortality_dt
    also: [plant::TF24_Model::compute_rates, plant::mortality_hazard_live]
    reads: [TF24.d_I, TF24.a_dG1, TF24.a_dG2]
    writes: []
    kind: closed_form
    fills: d
    note: 'Held at zero once the cumulative hazard is non-finite or at the establishment-failure sentinel (mortality_hazard_live), where survival is already zero. Not on an Overstorey page.'
  TF24.mortality_intrinsic:
    model: TF24
    section: tf24_mortality
    title: Growth-independent mortality
    latex: |
      d_{{\rm I}}(x, H) = d_{\rm I}
    code: plant::TF24_Model::mortality_growth_independent_dt
    reads: [TF24.d_I]
    writes: []
    kind: identity
  TF24.mortality_storage:
    model: TF24
    section: tf24_mortality
    title: Storage-dependent mortality
    latex: |
      d_{{\rm S}}(r) = \alpha_{{\rm dG1}} \exp(-\alpha_{{\rm dG2}} \, r)
    code: plant::TF24_Model::mortality_storage_dependent_dt
    reads: [TF24.a_dG1, TF24.a_dG2]
    writes: []
    kind: closed_form
    note: 'FF16''s growth-dependent form with relative reserves $r$ in place of production per leaf area, so it is bounded in $[\alpha_{\rm dG1} e^{-\alpha_{\rm dG2}}, \alpha_{\rm dG1}]$ and death is gradual as reserves run down. The header follows Stefaniak et al. 2026, Eq. 6. Not on an Overstorey page.'
  TF24.establishment:
    model: TF24
    section: tf24_mortality
    title: Establishment probability
    latex: |
      S_{\rm G} (x^\prime, H_0, E_{{\rm a}0}) = \frac{\exp(-\kappa_{\rm G} \, a_0)}{1 + X^2}, \qquad X = \alpha_{{\rm d0}} \frac{A_{\rm l}}{{\rm d}B / {\rm d}t}
    code: plant::TF24_Model::establishment_probability
    also: [plant::TF24_Model::seed_geometry, plant::TF24_Model::net_mass_production_dt]
    reads: [TF24.a_d0, TF24.recruitment_decay, H_0]
    writes: []
    kind: closed_form
    fills: S_G
    note: 'FF16''s form, on the seed''s net production at $H_0$ in the birth light, with both departures at rest and the tracked return at break-even; zero where ${\rm d}B/{\rm d}t \le 0$. $a_0$ is the patch age at birth. Not on an Overstorey page.'

  # --- TF24: birth size, competition, census ------------------------------------------
  TF24.seed_height:
    model: TF24
    section: tf24_competition
    title: Height at birth
    latex: |
      M_{\rm a}(H_0) = \omega
    code: plant::TF24_Model::height_seed
    also: [plant::TF24_Model::prepare_strategy, plant::TF24_Model::mass_live_given_height, plant::TF24_Model::seed_geometry, plant::TF24_Model::set_initial_states, plant::TF24_Model::initial_height]
    reads: [TF24.omega, TF24.lma, TF24.rho, TF24.theta, TF24.eta, TF24.a_l1, TF24.a_l2, TF24.a_b1, TF24.a_r1, TF24.a_cr1]
    writes: []
    kind: closed_form
    fills: H_0
    note: 'The live mass of a newborn on its allometry, coarse roots included and no storage, equals the seed mass; solved by bisection in prepare_strategy and, on an active scalar, declared through implicit_value. set_initial_states writes it onto the height state at birth. Not on an Overstorey page.'
  TF24.competition:
    model: TF24
    section: tf24_competition
    title: TF24's competition contribution
    latex: |
      \textrm{competition}(z, H) = k_{\rm I} \, A_{\rm l} \, Q(z, H)
    code: plant::TF24_Model::compute_competition
    reads: [TF24.k_I, A_l, Q]
    writes: []
    kind: closed_form
    overstorey: theory/size-structured-pde.qmd
    note: 'On the leaf area the plant carries, so a thinned canopy casts less shade.'
  TF24.census:
    model: TF24
    section: tf24_competition
    title: TF24's census metrics
    latex: |
      w \in \left\{ A_{\rm l}, \; M_{\rm l} + M_{\rm b} + M_{\rm s} + M_{\rm h}, \; A_{\rm b} + A_{\rm s} + A_{\rm h} \right\}
    code: plant::TF24_Model::census_metrics
    also: [plant::TF24_Model::area_leaf_carried, plant::TF24_Model::mass_above_ground, plant::TF24_Model::area_stem]
    reads: [TF24.a_l1, TF24.a_l2]
    writes: []
    kind: identity
    fills: w
    note: 'Reported as leaf_area, mass_above_ground and area_stem, in that order, on the leaf area and sapwood the plant carries. Not on an Overstorey page.'

  # --- TF24: the soil water column ------------------------------------------------
  TF24.layer_geometry:
    model: TF24
    section: tf24_soil
    title: Layer boundaries and midpoints
    latex: |
      z_i = \sum_{j = 0}^{i} \Delta z_j, \qquad \bar z_i = \tfrac{1}{2}\left(z_{i-1} + z_i\right),\ z_{-1} = 0, \qquad D = z_{N-1}
    code: plant::TF24_Environment::finalise_soil_geometry_
    also: [plant::TF24_Environment::set_soil_number_of_depths, plant::TF24_Environment::set_soil_layer_widths, plant::TF24_Environment::get_soil_mid_depths]
    reads: [TF24.soil_number_of_depths, TF24.depth, TF24.dz, 'phylloptim:root_network_from_carbon']
    writes: []
    kind: closed_form
    overstorey: theory/soil-water.qmd
    note: 'The page (sec-layers) gives these in prose. With equal layers (set_soil_number_of_depths) $\Delta z_i = D / N$ and the code builds $z_i = (i + 1) D / N$ rather than the running sum, which differs from it in the last bit; set_soil_layer_widths takes the $\Delta z_i$ and sets $D$ from them. $z_i$ is handed to the leaf as its layer depths and $\bar z_i$ as its precomputed midpoints (use_precomputed_z_soil_mid_), in place of phylloptim''s own (phylloptim:layer_midpoints, the same rule), where it sets the gravity head. The root network reads the widths as phylloptim''s layer_thicknesses of $z$ (z_thickness), equal to $\Delta z_i$ only to rounding. Setting the geometry resets the water state and drops per-layer soil parameters.'
  TF24.rainfall_floor:
    model: TF24
    section: tf24_soil
    title: Rainfall floored at zero
    latex: |
      P = \max\left(0,\ P_{\rm driver}(t)\right)
    code: plant::TF24_Environment::rainfall_floored
    also: [plant::TF24_Environment::layer_rates]
    reads: [TF24.rainfall]
    writes: []
    kind: closed_form
    note: 'Not on the Overstorey page, whose $P$ is the driver itself. A spline through intermittent rain undershoots below zero; the floor bounds the sign (counted as the rainfall clamp) and so adds the area of the undershoot to the rain received. The overload of layer_rates that the soil substeps call floors it the same way without counting the clamp.'
  TF24.infiltration:
    model: TF24
    section: tf24_soil
    title: Infiltration and saturation-excess runoff
    latex: |
      q_{{\rm in},0} = P\left[1 - a_{\rm infil}\left(\frac{\theta_0}{\theta_{\rm sat}}\right)^{b_{\rm infil}}\right]^{+}
    code: plant::TF24_Environment::layer_rates
    also: [plant::TF24_Environment::infiltrated_share]
    reads: [TF24.a_infil, TF24.b_infil, TF24.soil_moist_sat]
    writes: []
    kind: closed_form
    overstorey: theory/soil-water.qmd
    note: 'As the page writes it (eq-infiltration). $\theta_{\rm sat}$ is layer 0''s. The floor binds where $a_{\rm infil} (\theta_0 / \theta_{\rm sat})^{b_{\rm infil}} > 1$, counted as the infiltration clamp. The rain it turns away is runoff, which no accumulator holds on its own (TF24.cumulative_fluxes). A water pulse does not pass through this term (TF24.water_pulse).'
  TF24.drainage:
    model: TF24
    section: tf24_soil
    title: Gravitational drainage
    latex: |
      q_{{\rm out},i} = K(\theta_i) = K_{\rm sat}\left(\frac{\tilde\theta_i}{\theta_{\rm sat}}\right)^{2n_\psi + 3}, \qquad \tilde\theta_i = \min\left(\max(\theta_i, 0),\ \theta_{\rm sat}\right)
    code: plant::TF24_Environment::conductivity
    also: [plant::TF24_Environment::layer_rates]
    reads: [TF24.K_sat, TF24.soil_moist_sat, TF24.n_psi]
    writes: []
    kind: closed_form
    overstorey: theory/soil-water.qmd
    note: 'Clapp and Hornberger (1978) as parameterised by Zeng and Decker (2009). The page (eq-drainage) states the clamp $\tilde\theta_i$ in its text, not its equation, and names the function soil_K_from_soil_theta, which is conductivity in the code. $K_{\rm sat}$, $\theta_{\rm sat}$ and $n_\psi$ are layer $i$''s. A stage outside $[0, \theta_{\rm sat}]$ is counted as the soil-conductivity clamp. Free drainage: the matric gradient is dropped, so the flux carries no distance between layers and holds unchanged for unequal widths.'
  TF24.layer_balance:
    model: TF24
    section: tf24_soil
    title: Water balance of each layer
    latex: |
      \frac{{\rm d}\theta_i}{{\rm d}t} = \frac{q_{{\rm in},i} - q_{{\rm out},i} - u_i}{\Delta z_i}, \qquad q_{{\rm in},i} = q_{{\rm out},i-1}\ (i > 0)
    code: plant::TF24_Environment::compute_rates
    also: [plant::TF24_Environment::layer_rates, plant::Patch::compute_rates, plant::Patch::subsystem_rates]
    reads: [TF24.dz, TF24.soil_moist_residual]
    writes: [soil]
    kind: derivative
    overstorey: theory/soil-water.qmd
    note: 'eq-layer-balance; the page gives the inflow chain in prose. The rate is set to zero where $\theta_i \le \theta_r$ and it is not positive (or is NaN), so a layer at the residual floor is only rewetted (the page''s residual-moisture callout); counted as the soil-positivity clamp. While it holds, that layer''s drainage still enters the layer below and its uptake is still booked in the uptake accumulator, so the column budget closes exactly only while the floor is slack. A step spanning a change in the rain''s form may substep these rates with the uptake held at its last value (Patch::subsystem_rates). No capillary or upward flux between layers. Writes the rates of the moisture states in soil.'
  TF24.layer_uptake:
    model: TF24
    section: tf24_soil
    title: Root uptake from each layer, summed over the stand
    latex: |
      u_i = \frac{1}{A_{\rm P}} \sum_{s} \int_0^\infty N(H | x_s, a)\, c_i(x_s, H) \, {\rm d}H
    code: plant::Patch::compute_rates
    also: [plant::Species::consumption_rate, plant::Node::consumption_rate, plant::Individual::consumption_rate]
    reads: [patch_area]
    writes: []
    kind: integrator
    overstorey: theory/soil-water.qmd
    note: '$u_i$ is the page''s total root uptake from layer $i$ (the resource_depletion vector), which the page defines in prose; it is not the page''s eq-layer-uptake, which is the leaf''s per-leaf-area draw (phylloptim:multilayer_uptake). $c_i$ is one plant''s consumption rate from layer $i$, in m³ yr⁻¹ (TF24.water_uptake''s $U_i$). A trapezium over the nodes in the density''s own coordinate (birth date, for TF24), plus the absorbed top layer, as for a stand total. A layer gaining water through the roots has $c_i < 0$, so $u_i$ can be negative. Not applied when the patch reads a given environment (a constant field or a recorded run), whose soil the stand does not move; under TF24w the patch column takes none of it, each plant drawing on its own column instead.'
  TF24.retention:
    model: TF24
    section: tf24_soil
    title: The retention curve, moisture to potential
    latex: |
      \psi^\ast_{\rm soil}(\theta) = \min\left(a_\psi\left(\frac{\max(\theta, \theta_r)}{\theta_{\rm sat}}\right)^{-n_\psi},\ \psi^\ast_{\max}\right)
    code: plant::TF24_Environment::psi_from_soil_moist
    also: [plant::TF24_Environment::get_soil_water_potential_state, plant::TF24_Environment::cohort_reads]
    reads: [TF24.a_psi, TF24.n_psi, TF24.soil_moist_sat, TF24.soil_moist_residual, TF24.soil_psi_max_]
    writes: []
    kind: closed_form
    overstorey: theory/soil-water.qmd
    note: 'The page (eq-retention) writes $a_\psi / 10^6$, with $a_\psi$ in Pa; the code holds $a_\psi$ in MPa and divides by nothing. The page''s callout caps the potential at $10^3$ MPa; the code caps it at $\psi^\ast_{\max}$ (soil_psi_max_). The floor and the cap are each counted as a clamp. A positive magnitude per layer, with that layer''s parameters, cached until the state moves and read by every cohort as the leaf''s psi_soil. The R binding evaluates layer 0''s curve.'
  TF24.retention_inverse:
    model: TF24
    section: tf24_soil
    title: The retention curve, potential to moisture
    latex: |
      \theta(\psi^\ast) = \theta_{\rm sat}\left(\frac{\psi^\ast}{a_\psi}\right)^{-1/n_\psi}
    code: plant::TF24_Environment::soil_moist_from_psi
    reads: [TF24.a_psi, TF24.n_psi, TF24.soil_moist_sat]
    writes: []
    kind: closed_form
    overstorey: theory/soil-water.qmd
    note: 'The page names it without writing it. $\psi^\ast$ is in MPa, the unit psi_from_soil_moist returns, so the two round-trip; the page''s callout that it takes Pa predates $a_\psi$''s move to MPa. It applies neither the floor nor the cap, so it inverts TF24.retention only between them. No model run calls it; the R binding evaluates layer 0''s curve.'
  TF24.cumulative_fluxes:
    model: TF24
    section: tf24_soil
    title: Cumulative water fluxes
    latex: |
      \frac{{\rm d}}{{\rm d}t}\left(R_{\rm P},\ R_{\rm in},\ R_{\rm dr},\ R_u,\ R_{\rm pulse}\right) = \left(P,\ q_{{\rm in},0},\ q_{{\rm out},N-1},\ \textstyle\sum_i u_i,\ 0\right)
    code: plant::TF24_Environment::compute_rates
    also: [plant::TF24_Environment::get_soil_water_state_cumulative_flux]
    reads: [TF24.rainfall]
    writes: [soil]
    kind: derivative
    overstorey: theory/soil-water.qmd
    note: 'The page (sec-diagnostics) lists four, as integrals, and gives aux_num as 4; the code carries five. The fifth, the runoff of water pulses, has its rate held at zero so it stays out of the step-size error norm, and moves only when a pulse is applied (TF24.water_pulse). Continuous runoff is not accumulated on its own: it is $R_{\rm P} - R_{\rm in} - R_{\rm pulse}$. Diagnostics only: nothing in the balance reads them. Writes the rates of the trailing states in soil.'
  TF24.water_pulse:
    model: TF24
    section: tf24_soil
    title: A pulse of water into one layer
    latex: |
      \theta_i \leftarrow \theta_i + \frac{\min\left(d,\ \Delta z_i \left[\theta_{\rm sat} - \theta_i\right]^{+}\right)}{\Delta z_i}
    code: plant::TF24_Environment::add_water_pulse_to_layer
    also: [plant::TF24_Environment::add_resource_pulse, plant::TF24_Environment::add_water_pulse, plant::TF24_Environment::pulse_capacity]
    reads: [TF24.soil_moist_sat, TF24.dz]
    writes: [soil]
    kind: closed_form
    note: 'Not on the Overstorey soil-water page. A depth $d$ (m) added to layer $i$ between solver legs, by a scheduled event: layer 0 is rain, a deeper layer irrigation or a rising water table. Capped at what the layer can still hold; the excess is pulse runoff. Adds $d$ to $R_{\rm P}$, the accepted depth to $R_{\rm in}$ and the excess to $R_{\rm pulse}$, whichever layer it enters. It does not pass through TF24.infiltration. $\theta_{\rm sat}$ is layer $i$''s.'

not_parameters:
  n_patches: 'Not read by any C++ code.'
  strategies: 'The species'' strategies: a container; their parameters are each model''s entries.'
  strategy_default: 'The template new strategies are built from: a container of model parameters.'
  node_schedule_times_default: 'A numerical schedule of cohort introduction times, derived from max_patch_lifetime.'
  node_schedule_times: 'The cohort introduction times per species: the quadrature grid over birth dates, a numerical choice.'
  ode_times: 'A record of the last run''s step times, replayed to reproduce it.'
  ode_step_sizes: 'A record of the last run''s step sizes, replayed to reproduce it.'
  ode_soil_input_slopes: 'A record of the last run''s soil substepping, replayed to reproduce it.'
  ode_soil_substep_ends: 'A record of the last run''s soil substepping, replayed to reproduce it.'
  initial_state: 'A stored patch state to start from instead of an empty patch (resume or a given stand).'
  n_initial_cohorts: 'Node counts per species of the stored initial state.'
  initial_node_times: 'Birth dates of the stored initial state''s nodes.'
  initial_patch_density: 'Patch-age density at birth of the stored initial state''s nodes.'
  initial_pr_patch_survival: 'Patch survival at birth of the stored initial state''s nodes.'
  initial_time: 'The patch age a resumed run starts at; 0 for a fresh one.'
  hyperpar: 'The R trade-off function the strategies were built with; opaque to C++.'
  TF24.stem_b: 'Derived from (stem_P50, stem_c), the Weibull scale phylloptim:stem_b; phylloptim derives its own, so this reporting copy reaches nothing.'
  TF24.psi_crit: 'Derived from (stem_P50, stem_c), the critical potential phylloptim:psi_crit; phylloptim derives its own, so this reporting copy reaches nothing.'
  TF24.root_b: 'Derived from (root_P50, root_c), the Weibull scale phylloptim:root_b; phylloptim derives its own, so this reporting copy reaches nothing.'
  TF24.root_psi_crit: 'Derived from (root_P50, root_c), the critical potential phylloptim:root_psi_crit; phylloptim derives its own, so this reporting copy reaches nothing.'
