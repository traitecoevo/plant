    meaning: 'conduit widening exponent, $D(L) \propto L^{D_{\rm c}}$ with distance $L$ from the apex; reaches the model only through the path exponent $\beta$'
    source: 'TF24_Pars default; the header calls it measured and conserved across vascular plants, with a within-stem range of about 0.1 to 0.3'
    placeholder: false
    code: plant::TF24_Pars::D_c
  TF24.theta_c:
    model: TF24
    section: tf24_hydraulics
    symbol: '\theta_{\rm c}'
    units: '–'
    class: hyperparameter
    meaning: 'Huber-profile exponent, $\theta(L) = \theta (L / L_{\rm tip})^{-\theta_{\rm c}}$; refused unless zero, because $\theta$ also sets sapwood mass, respiration and storage, which still read a constant $\theta$'
    source: 'TF24_Pars default, zero; prepare_strategy refuses any other value'
    placeholder: false
    code: plant::TF24_Pars::theta_c
  TF24.L_tip:
    model: TF24
    section: tf24_hydraulics
    symbol: 'L_{\rm tip}'
    units: 'm'
    class: hyperparameter
    meaning: 'terminal segment length, the anchor of both within-stem profiles; identifiable only with $K_{\rm s}$ and $\theta$ in $\theta L_{\rm tip}^{\beta} / K_{\rm s}$'
    source: TF24_Pars default
    placeholder: false
    code: plant::TF24_Pars::L_tip
  TF24.root_depth_shape_eta:
    model: TF24
    section: tf24_hydraulics
    symbol: '\eta_{\rm r}'
    units: '–'
    class: hyperparameter
    meaning: 'shape exponent of fine-root mass over depth, the crown profile''s $\eta$ on the soil'
    source: TF24_Pars default
    placeholder: false
    code: plant::TF24_Pars::root_depth_shape_eta
  TF24.rooting_depth_max:
    model: TF24
    section: tf24_hydraulics
    symbol: 'D_{\rm r,max}'
    units: 'm'
    class: trait
    meaning: 'maximum rooting depth; rooting depth is $\min(H, D_{\rm r,max})$, and should not exceed the soil column'
    source: 'TF24_Pars default, the default soil depth'
    placeholder: false
    code: plant::TF24_Pars::rooting_depth_max
  TF24.root_mass_carbon_scale:
    model: TF24
    section: tf24_hydraulics
    symbol: 's_{\rm r}'
    units: 'mol C kg⁻¹'
    class: constant
    meaning: 'carbon per unit fine-root dry mass: turns fine-root mass per leaf area into the root carbon per leaf area the root network is built from'
    source: 'Hard-coded, 83.26 × 0.5: mol of carbon per kg of carbon (1000 / 12.01) times a carbon fraction of one half; the header names promoting it to a trait as a follow-up'
    placeholder: true
    code: plant::root_mass_carbon_scale
    literal: 41.63
  TF24.beta_R_H:
    model: TF24
    section: tf24_hydraulics
    code: plant::TF24_Model::beta_R_H
    link: 'phylloptim:beta_R_H'
    literal: 3.4e+2
    note: 'Hard-coded on TF24_Model, which runs the root-architecture model and hands the leaf its resistances.'
  TF24.beta_R_V:
    model: TF24
    section: tf24_hydraulics
    code: plant::TF24_Model::beta_R_V
    link: 'phylloptim:beta_R_V'
    literal: 9.4e+3
    note: 'Hard-coded on TF24_Model, as beta_R_H.'

  # --- TF24: storage ---------------------------------------------------------------
  TF24.a_st1:
    model: TF24
    section: tf24_storage
    symbol: '\alpha_{\rm st1}'
    units: 'kg kg⁻¹'
    class: hyperparameter
    meaning: 'storage capacity per unit sapwood mass'
    source: 'TF24_Pars default; the header follows Stefaniak et al. 2026 (plantNSC)'
    placeholder: true
    code: plant::TF24_Pars::a_st1
  TF24.a_st2:
    model: TF24
    section: tf24_storage
    symbol: '\alpha_{\rm st2}'
    units: '–'
    class: hyperparameter
    meaning: 'relative reserves at which the growth gate is half open'
    source: TF24_Pars default
    placeholder: true
    code: plant::TF24_Pars::a_st2
  TF24.a_st3:
    model: TF24
    section: tf24_storage
    symbol: '\alpha_{\rm st3}'
    units: '–'
    class: hyperparameter
    meaning: 'storage at birth, as a fraction of capacity'
    source: 'TF24_Pars default; the header cites Stefaniak et al. 2026, Eq. 8'
    placeholder: true
    code: plant::TF24_Pars::a_st3
  TF24.storage_relaxation_offset:
    model: TF24
    section: tf24_storage
    symbol: '\tau_{\rm o}'
    units: 'yr'
    class: hyperparameter
    meaning: 'added to the pool''s own relaxation time, $S_{\max} / (c + d)$, which is hours in a seedling; must be non-negative'
    source: 'TF24_Pars default, 7 / 365 (a week)'
    placeholder: true
    code: plant::TF24_Pars::storage_relaxation_offset
  TF24.storage_gate_width:
    model: TF24
    section: tf24_storage
    symbol: 'w_{\rm G}'
    units: '–'
    class: constant
    meaning: 'width of the logistic growth gate on relative reserves'
    source: 'Hard-coded on TF24_Model'
    placeholder: false
    code: plant::TF24_Model::storage_gate_width
    literal: 0.1
  TF24.storage_prod_eps:
    model: TF24
    section: tf24_storage
    symbol: '\epsilon_{\rm P}'
    units: 'kg yr⁻¹'
    class: constant
    meaning: 'smoothing scale of the positive part of net production'
    source: 'Hard-coded on TF24_Model'
    placeholder: false
    code: plant::TF24_Model::storage_prod_eps
    literal: 1.0e-4

  # --- TF24: flexible allometry and sapwood acclimation ------------------------
  TF24.a_pl0:
    model: TF24
    section: tf24_plasticity
    symbol: '\alpha_{\rm pl0}'
    units: '–'
    class: hyperparameter
    meaning: 'largest fraction of leaf and sapwood turnover a plant leaves unreplaced; zero is the fixed allometry exactly'
    source: 'TF24_Pars default, zero: flexible allometry is off'
    placeholder: false
    code: plant::TF24_Pars::a_pl0
  TF24.a_pl1:
    model: TF24
    section: tf24_plasticity
    symbol: '\alpha_{\rm pl1}'
    units: '–'
    class: hyperparameter
    meaning: 'tracked marginal leaf return at which withholding is half its maximum; zero is break-even, where a leaf stops covering its own upkeep'
    source: 'TF24_Pars default, zero; the header follows Manzoni et al. 2015'
    placeholder: false
    code: plant::TF24_Pars::a_pl1
  TF24.a_pl2:
    model: TF24
    section: tf24_plasticity
    symbol: '\alpha_{\rm pl2}'
    units: '–'
    class: hyperparameter
    meaning: 'log-gap scale of rebuilding, of the canopy floor''s taper and of sapwood replacement'
    source: TF24_Pars default
    placeholder: true
    code: plant::TF24_Pars::a_pl2
  TF24.a_pl3:
    model: TF24
    section: tf24_plasticity
    symbol: '\alpha_{\rm pl3}'
    units: '–'
    class: hyperparameter
    meaning: 'smallest canopy a plant thins to, as a fraction of the leaf area its height implies'
    source: TF24_Pars default
    placeholder: true
    code: plant::TF24_Pars::a_pl3
  TF24.a_pl4:
    model: TF24
    section: tf24_plasticity
    symbol: '\alpha_{\rm pl4}'
    units: 'yr⁻¹'
    class: hyperparameter
    meaning: 'rate at which the tracked marginal leaf return follows the instantaneous one; $1 / \alpha_{\rm pl4}$ is its memory'
    source: 'TF24_Pars default, about a four-month memory'
    placeholder: true
    code: plant::TF24_Pars::a_pl4
  TF24.a_sw:
    model: TF24
    section: tf24_plasticity
    symbol: '\alpha_{\rm sw}'
    units: 'yr⁻¹'
    class: hyperparameter
    meaning: 'rate at which sapwood per leaf area moves toward the ratio that maximises growth; zero pins it to the pipe model'
    source: 'TF24_Pars default, zero: sapwood acclimation is off'
    placeholder: false
    code: plant::TF24_Pars::a_sw
  TF24.plasticity_gate_width:
    model: TF24
    section: tf24_plasticity
    symbol: 'w_{\rm pl}'
    units: '–'
    class: constant
    meaning: 'width of the replacement gate, in units of the marginal leaf return'
    source: 'Hard-coded on TF24_Model'
    placeholder: false
    code: plant::TF24_Model::plasticity_gate_width
    literal: 0.02

  # --- TF24: seed production -----------------------------------------------------
  TF24.omega:
    model: TF24
    section: tf24_fecundity
    symbol: '\omega'
    units: 'kg'
    class: trait
    meaning: 'seed mass'
    source: TF24_Pars default
    cite: Falster-2016
    placeholder: false
    code: plant::TF24_Pars::omega
  TF24.hmat:
    model: TF24
    section: tf24_fecundity
    symbol: 'H_{{\rm mat}}'
    units: 'm'
    class: trait
    meaning: 'height at maturation'
    source: TF24_Pars default
    cite: Falster-2016
    placeholder: false
    code: plant::TF24_Pars::hmat
  TF24.a_f1:
    model: TF24
    section: tf24_fecundity
    symbol: '\alpha_{\rm f1}'
    units: '–'
    class: hyperparameter
    meaning: 'largest fraction of production allocated to reproduction'
    source: TF24_Pars default
    cite: Falster-2016
    placeholder: false
    code: plant::TF24_Pars::a_f1
  TF24.a_f2:
    model: TF24
    section: tf24_fecundity
    symbol: '\alpha_{\rm f2}'
    units: '–'
    class: hyperparameter
    meaning: 'sharpness of the switch to reproduction about $H_{\rm mat}$'
    source: TF24_Pars default
    cite: Falster-2016
    placeholder: false
    code: plant::TF24_Pars::a_f2
  TF24.a_f3:
    model: TF24
    section: tf24_fecundity
    symbol: '\alpha_{\rm f3}'
    units: 'kg'
    class: trait
    meaning: 'accessory cost of reproduction per seed'
    source: 'TF24_Pars default, three times the default seed mass; the frozen trade-off derives it as $\beta_{\rm f1} \omega$'
    cite: Falster-2016
    placeholder: false
