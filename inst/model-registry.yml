    fills: S_D
  TF24.a_d0:
    model: TF24
    section: tf24_mortality
    symbol: '\alpha_{\rm d0}'
    units: 'kg yr⁻¹ m⁻²'
    class: hyperparameter
    meaning: 'scale of the seedling''s production per leaf area below which establishment fails'
    source: TF24_Pars default
    cite: Falster-2016
    placeholder: false
    code: plant::TF24_Pars::a_d0
  TF24.d_I:
    model: TF24
    section: tf24_mortality
    symbol: 'd_{\rm I}'
    units: 'yr⁻¹'
    class: trait
    meaning: 'growth-independent mortality rate'
    source: 'TF24_Pars default; the frozen trade-off derives it from wood density as $\beta_{\rm dI1} (\rho / \rho_0)^{-\beta_{\rm dI2}}$, flat at the default $\beta_{\rm dI2} = 0$'
    cite: Falster-2016
    placeholder: false
    code: plant::TF24_Pars::d_I
  TF24.a_dG1:
    model: TF24
    section: tf24_mortality
    symbol: '\alpha_{\rm dG1}'
    units: 'yr⁻¹'
    class: hyperparameter
    meaning: 'storage-dependent mortality rate with empty reserves'
    source: 'TF24_Pars default; the header follows Stefaniak et al. 2026, Eq. 6'
    placeholder: true
    code: plant::TF24_Pars::a_dG1
  TF24.a_dG2:
    model: TF24
    section: tf24_mortality
    symbol: '\alpha_{\rm dG2}'
    units: '–'
    class: hyperparameter
    meaning: 'sensitivity of mortality to relative reserves'
    source: TF24_Pars default
    placeholder: true
