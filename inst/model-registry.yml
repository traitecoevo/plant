    cite: Kohyama-1993
    placeholder: false
    code: plant::K93_Pars::d_0
  K93.d_1:
    model: K93
    section: k93_fecundity
    symbol: 'd_1'
    units: 'm² cm⁻²'
    class: trait
    meaning: 'reduction of recruitment per unit basal area of larger trees'
    source: 'K93_Pars default; attributed by the constructor to Table 1 of Kohyama-1993, not yet checked against the paper. The header comment gives the units as m² cm⁻² yr⁻¹; $d_1 B$ is an exponent, so $d_1$ carries no yr⁻¹'
    cite: Kohyama-1993
    placeholder: false
    code: plant::K93_Pars::d_1
  K93.c_0:
    model: K93
    section: k93_mortality
    symbol: 'c_0'
    units: 'yr⁻¹'
    class: trait
