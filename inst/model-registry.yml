    cite: Kohyama-1993
    placeholder: false
    code: plant::K93_Pars::c_1
  K93.eta:
    model: K93
    section: k93_competition
    symbol: '\eta'
    units: '–'
    class: hyperparameter
    meaning: 'smoothing parameter of the crown profile through which a larger tree''s basal area is felt, so the competition field is a continuous function of size'
    source: 'K93_Pars default; a plant addition, not in Kohyama-1993'
    placeholder: true
    code: plant::K93_Pars::eta
    fills: eta
  K93.k_I:
    model: K93
    section: k93_competition
    symbol: 'k_{\rm I}'
    units: 'm² cm⁻²'
    class: hyperparameter
    meaning: 'scale of the map between basal area above and the [0, 1] environment the shared layer interpolates, $E = \exp(-k_{\rm I} B)$. Each species adds $k_{\rm I} B$ to the one shared environment and reads it back divided by its own $k_{\rm I}$, so it cancels only when every species shares it; where species differ it weights each one''s basal area in the others'' competition (species $j$ sees $\sum_i (k_{{\rm I},i} / k_{{\rm I},j}) B_i$)'
    source: 'K93_Pars default; a plant addition, not in Kohyama-1993'
