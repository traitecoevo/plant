# THROWAWAY PROBE BRANCH -- never merge. test-scm.R's invader-vs-stand gap on
# Windows at develop, without #686 and without #713.
on:
  workflow_dispatch:

name: R-CMD-check

jobs:
  probe:
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: Build three and probe
        shell: bash
        run: |
          for v in dev no686 no713; do
            mkdir -p "../src_$v" "lib_$v"
            git archive HEAD | tar -x -C "../src_$v"
          done
          (cd ../src_no686 && patch -p1 < "$GITHUB_WORKSPACE/probe/revert686.patch")
          (cd ../src_no713 && patch -p1 < "$GITHUB_WORKSPACE/probe/revert713.patch")
          for v in dev no686 no713; do
            R CMD INSTALL --no-test-load -l "lib_$v" "../src_$v" > "inst_$v.log" 2>&1 || { tail -50 "inst_$v.log"; exit 1; }
          done
          for v in dev no686 no713; do
            R_LIBS="$PWD/lib_$v" Rscript probe/probe_inv.R "$v"
          done
