# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - master
      - develop

name: R-CMD-check

# Supersede in-flight runs on the same ref. Without this, every intermediate push
# to a PR branch ran a full 13-20 min matrix to completion alongside its
# successor.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    if: github.event.pull_request.draft == false

    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is new here: it had been commented out since CI was first
        # set up (#295), so plant had never had a green Linux run despite nothing
        # in DESCRIPTION restricting the platform. It is the cheapest runner on a
        # private repo (Linux bills at 1x against Windows 2x and macOS 10x),
        # which is why it is worth having.
        #
        # It is also the fastest, but ONLY once its dependency cache is warm, and
        # the gap between those two states is large enough to mislead:
        #
        #   Linux deps, first ever run (cold): 205 s   -> whole job 9.9 min
        #   Linux deps, second run (warm):      37 s   -> whole job  5.5 min
        #   macOS deps for comparison:          53 s   -> whole job  5.7 min
        #
        # Cold, Linux is the SLOWEST of the three, because odelia/phylloptim/RcppR6
        # are GitHub remotes with no Linux binaries and build from source. Warm, it
        # is the fastest leg we have. Anyone re-measuring this on a fresh branch or
        # after a dependency bump will hit the cold number first -- do not conclude
        # from it.
        #
        # The follow-up this enables is making Linux the only per-PR job, with
        # Windows gated on src/** and inst/include/** rather than dropped: that is
        # where plant is most platform-fragile (src/Makevars.win must link
        # odelia.dll at load time because mingw ld forbids undefined symbols in a
        # DLL, see traitecoevo/odelia#29) and macOS on pushes to develop/master.
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: macOS-latest, r: 'release'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # DESCRIPTION sets Config/testthat/parallel, but both runners were only
      # starting 2 test processes. Standard runners have 4 cores; check the
      # "Starting N test processes" line in the log to confirm this takes effect
      # rather than assuming it did.
      TESTTHAT_CPUS: 4

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
          check-dir: '"check"'
          upload-snapshots: true
