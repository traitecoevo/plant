# THROWAWAY PROBE BRANCH -- never merge. test-scm.R's invader-vs-stand gap on
# Windows, replaying the test body with each earlier call dropped in turn.
on:
  workflow_dispatch:

name: R-CMD-check

jobs:
  probe:
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat

      - name: Build and probe
        shell: bash
        run: |
          mkdir -p ../src_dev lib_dev
          git archive HEAD | tar -x -C ../src_dev
          R CMD INSTALL --no-test-load -l lib_dev ../src_dev > inst_dev.log 2>&1 || { tail -50 inst_dev.log; exit 1; }
          R_LIBS="$PWD/lib_dev" Rscript probe/probe_heap.R win
