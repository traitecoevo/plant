# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - master
      - develop
  # Runs every platform on any branch, e.g. to try a toolchain change on
  # Windows and macOS before it merges.
  workflow_dispatch:

name: R-CMD-check

# Supersede in-flight runs on the same ref. Without this, every intermediate push
# to a PR branch ran a full 13-20 min matrix to completion alongside its
# successor.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chooses the platforms. A push to develop/master or a manual run checks all
  # three. A PR checks Linux, and adds Windows when it touches compiled code,
  # DESCRIPTION or CI: Windows is where plant is most platform-fragile, because
  # src/Makevars.win must link odelia.dll at build time (mingw ld forbids
  # undefined symbols in a DLL, traitecoevo/odelia#29), and a dependency bump
  # changes only DESCRIPTION. A PR's Windows leg leaves out some slow test
  # files (see the step before the check). macOS runs on pushes only. A
  # matrix entry cannot carry a job-level `if`, so the matrix itself is the
  # output.
  platforms:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      config: ${{ steps.pick.outputs.config }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The PR's merge commit and its first parent, the base it merges into.
          fetch-depth: 2

      - id: pick
        shell: bash
        run: |
          linux='{"os": "ubuntu-latest", "r": "release"}'
          windows='{"os": "windows-latest", "r": "release"}'
          macos='{"os": "macOS-latest", "r": "release"}'
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            config="[$linux, $windows, $macos]"
          elif git diff --name-only HEAD^1 HEAD |
               grep -qE '^(src/|inst/include/|DESCRIPTION$|\.github/)'; then
            config="[$linux, $windows]"
          else
            config="[$linux]"
          fi
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "Platforms: $config"

  R-CMD-check:
    needs: platforms
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        # The dependency step is cache-sensitive: odelia, phylloptim and RcppR6
        # are GitHub remotes with no binaries, so they build from source when
        # the cached library predates a pin bump, or for RcppR6, which is not
        # pinned, a new commit upstream. Do not rank Linux
        # against macOS from single runs; macOS's check step varies by ~150 s on
        # unchanged code. Windows is the only leg tight enough to A/B on.
        config: ${{ fromJSON(needs.platforms.outputs.config) }}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # DESCRIPTION sets Config/testthat/parallel, but both runners were only
      # starting 2 test processes. Standard runners have 4 cores; check the
      # "Starting N test processes" line in the log to confirm this takes effect
      # rather than assuming it did.
      TESTTHAT_CPUS: 4
      # Nothing else sets MAKEFLAGS, so without it R compiles plant, odelia and
      # phylloptim one translation unit at a time. Four of plant's units take
      # most of the compile, so -j4 cuts a cold build about threefold. Each of
      # those four peaks near 3 GB under clang; the macOS runner has 7 GB and
      # 3 cores, the others 16 GB and 4.
      MAKEFLAGS: ${{ matrix.config.os == 'macOS-latest' && '-j2' || '-j4' }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # The package library is cached here rather than by setup-r-dependencies,
      # so that only pushes save it. When a PR saved its own, GitHub restored
      # that PR's copy ahead of develop's newer one, so every open PR rebuilt
      # odelia and phylloptim after each pin bump, and the PR copies pushed the
      # repository past its cache quota, evicting develop's. A PR now restores
      # develop's library and leaves nothing behind. The cost is that a PR
      # which bumps a pin rebuilds odelia and phylloptim on every push.
      #
      # The key names the OS release, because binaries built against one
      # release's system libraries can fail to load on the next, and the month,
      # so that develop saves afresh once CRAN has moved on from its copy.
      - name: Name the package library cache
        id: library-key
        shell: Rscript {0}
        run: |
          prefix <- paste("library", sessionInfo()$running, R.version$arch,
                          getRversion(), sep = "-")
          prefix <- gsub("[^A-Za-z0-9.]+", "_", prefix)
          out <- Sys.getenv("GITHUB_OUTPUT")
          cat(sprintf("prefix=%s-\n", prefix), file = out, append = TRUE)
          cat(sprintf("month=%s\n", format(Sys.Date(), "%Y-%m")), file = out, append = TRUE)

      # actions/cache would otherwise find Rtools' zstd first on Windows;
      # setup-r-dependencies makes the same change before its own cache step.
      - name: Use the runner's zstd
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'C:/tools/zstd' >> "$GITHUB_PATH"

      - name: Restore the package library
        id: library-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.R_LIBS_USER }}/*
            !${{ env.R_LIBS_USER }}/pak
            !${{ env.R_LIBS_USER }}/_cache
          key: ${{ steps.library-key.outputs.prefix }}${{ steps.library-key.outputs.month }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: ${{ steps.library-key.outputs.prefix }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache: false

      - name: Save the package library
        if: github.event_name == 'push' && steps.library-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.R_LIBS_USER }}/*
            !${{ env.R_LIBS_USER }}/pak
            !${{ env.R_LIBS_USER }}/_cache
          key: ${{ steps.library-cache.outputs.cache-primary-key }}

      # Compiling plant is the largest single step of a check, and most PRs
      # leave most translation units unchanged. ccache keys each object on its
      # preprocessed source and flags, so a header change still recompiles
      # everything that includes it. Set up after the dependencies so that
      # odelia and phylloptim do not fill this cache. Only pushes save it, for
      # the reason the package library is saved only on pushes. The key's last
      # part is a version: changing it abandons every entry saved under the old
      # key, PRs' own included, which they would otherwise keep restoring.
      # No eviction by use: the post step also runs on a cancelled job, and
      # would save only the objects compiled before the cancel.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.config.os }}-r-${{ matrix.config.r }}-v2
          max-size: 500M
          save: ${{ github.event_name == 'push' }}

      # Wrap R's own compilers rather than naming any, so each platform keeps
      # the compiler and flags its R was built with. R_MAKEVARS_USER is read on
      # every platform, unlike ~/.R/Makevars.
      - name: Compile through ccache
        shell: bash
        run: |
          makevars="$RUNNER_TEMP/Makevars"
          for v in CC CXX CXX17 CXX20; do
            echo "$v = ccache $(R CMD config $v)" >> "$makevars"
          done
          cat "$makevars"
          echo "R_MAKEVARS_USER=$makevars" >> "$GITHUB_ENV"

      # The reference site deploys only from master, so a topic missing from
      # its index would otherwise first fail at release. Reads man/ only.
      - name: Check the pkgdown index
        if: runner.os == 'Linux'
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}

      # On a pull request, Windows checks that plant builds, links and loads,
      # which is where it is fragile (see the platforms job), and leaves out
      # the slow files in DESCRIPTION's Config/testthat/start-first. It keeps
      # each model's own file and the patch runner's, because those carry the
      # tests that have differed or failed on Windows before: the extreme
      # drought run and tolerances set by Windows' error. A push or a manual
      # run checks every file.
      - name: Leave some slow tests to the push run
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        shell: Rscript {0}
        run: |
          slow <- read.dcf("DESCRIPTION", "Config/testthat/start-first")[1, 1]
          slow <- trimws(strsplit(slow, ",")[[1]])
          keep <- utils::glob2rx(c("model-*", "deterministic-patch-runner"))
          slow <- slow[!Reduce(`|`, lapply(keep, grepl, x = slow))]
          cat("Leaving out:", slow, "\n")
          cat(sprintf("PLANT_TEST_EXCLUDE=%s\n", paste(utils::glob2rx(slow), collapse = "|")),
              file = Sys.getenv("GITHUB_ENV"), append = TRUE)

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
          check-dir: '"check"'
          upload-snapshots: true
