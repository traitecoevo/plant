# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - master
      - develop
  # Runs every platform on any branch, e.g. to try a toolchain change on
  # Windows and macOS before it merges.
  workflow_dispatch:

name: R-CMD-check

# Supersede in-flight runs on the same ref. Without this, every intermediate push
# to a PR branch ran a full 13-20 min matrix to completion alongside its
# successor.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chooses the platforms. A push to develop/master or a manual run checks all
  # three. A PR checks Linux, and adds Windows when it touches compiled code,
  # DESCRIPTION or CI: Windows is where plant is most platform-fragile, because
  # src/Makevars.win must link odelia.dll at build time (mingw ld forbids
  # undefined symbols in a DLL, traitecoevo/odelia#29), and a dependency bump
  # changes only DESCRIPTION. macOS runs on pushes only. A matrix entry cannot
  # carry a job-level `if`, so the matrix itself is the output.
  platforms:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      config: ${{ steps.pick.outputs.config }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The PR's merge commit and its first parent, the base it merges into.
          fetch-depth: 2

      - id: pick
        shell: bash
        run: |
          linux='{"os": "ubuntu-latest", "r": "release"}'
          windows='{"os": "windows-latest", "r": "release"}'
          macos='{"os": "macOS-latest", "r": "release"}'
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            config="[$linux, $windows, $macos]"
          elif git diff --name-only HEAD^1 HEAD |
               grep -qE '^(src/|inst/include/|DESCRIPTION$|\.github/)'; then
            config="[$linux, $windows]"
          else
            config="[$linux]"
          fi
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "Platforms: $config"

  R-CMD-check:
    needs: platforms
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        # The dependency step is cache-sensitive: odelia, phylloptim and RcppR6
        # are GitHub remotes with no binaries, so they build from source on a
        # cold cache (a fresh branch or a dependency bump). Do not rank Linux
        # against macOS from single runs; macOS's check step varies by ~150 s on
        # unchanged code. Windows is the only leg tight enough to A/B on.
        config: ${{ fromJSON(needs.platforms.outputs.config) }}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # DESCRIPTION sets Config/testthat/parallel, but both runners were only
      # starting 2 test processes. Standard runners have 4 cores; check the
      # "Starting N test processes" line in the log to confirm this takes effect
      # rather than assuming it did.
      TESTTHAT_CPUS: 4

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Compiling plant is the largest single step of a check, and most PRs
      # leave most translation units unchanged. ccache keys each object on its
      # preprocessed source and flags, so a header change still recompiles
      # everything that includes it. Set up after the dependencies so that
      # odelia and phylloptim, which have their own cache, do not fill this one.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.config.os }}-r-${{ matrix.config.r }}
          max-size: 500M

      # Wrap R's own compilers rather than naming any, so each platform keeps
      # the compiler and flags its R was built with. R_MAKEVARS_USER is read on
      # every platform, unlike ~/.R/Makevars.
      - name: Compile through ccache
        shell: bash
        run: |
          makevars="$RUNNER_TEMP/Makevars"
          for v in CC CXX CXX17 CXX20; do
            echo "$v = ccache $(R CMD config $v)" >> "$makevars"
          done
          cat "$makevars"
          echo "R_MAKEVARS_USER=$makevars" >> "$GITHUB_ENV"

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
          check-dir: '"check"'
          upload-snapshots: true
