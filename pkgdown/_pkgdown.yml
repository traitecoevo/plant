url: https://traitecoevo.github.io/plant/

# The function reference only: the guides, theory and worked examples live on
# Overstorey, which the navbar and sidebar link to. .github/workflows/pkgdown.yaml
# renders this site into docs/ and deploys it to gh-pages on every push to
# master, so the site describes the released package.

template:
  bootstrap: 5
  bootswatch: cosmo

navbar:
  structure:
    left: [reference, guides, news]
    right: [search, github]
  components:
    guides:
      text: Guides
      icon: fa-book
      href: https://traitecoevo.github.io/overstorey/
      aria-label: Guides and theory, on Overstorey

home:
  links:
  - text: Guides and theory (Overstorey)
    href: https://traitecoevo.github.io/overstorey/
  - text: Project board
    href: https://github.com/orgs/traitecoevo/projects/5

reference:

- title: Parameters and strategies
  contents:
  - base_parameters
  - default_parameters
  - trait_matrix
  - add_strategies
  - generate_strategy
  - parameter_table
  - Control
  - control
  - Disturbance_Regime
  - Weibull_Disturbance_Regime
  - No_Disturbance
  - node_schedule_times_default
  - node_schedule_times_periodic
  - model_version

- title: Running a stand
  contents:
  - run
  - scenario
  - landscape
  - run_mutant
  - tidy.plant_run
  - environment_type
  - run_until_converged
  - events
  - rainfall_pulse
  - set_tf24_soil
  - make_initial_state
  - set_initial_state
  - export_patch_state
  - check_driver_interpolation

- title: Fitness and gradients
  contents:
  - fitness_window
  - fixed_point_fitness
  - stand_census
  - stand_census_state_adjoint
  - stand_gradient
  - stand_gradient_refused
  - stand_gradient_compare
  - gradient_control

- title: Individuals
  contents:
  - Individual
  - optimise_individual_rate_at_size_by_trait
  - resource_compensation_point
  - canopy_profile
  - Leaf

- title: Outputs
  contents:
  - tidy_individual
  - tidy_snapshots
  - FF16_expand_state
  - integrate_over_size_distribution
  - sample_size_distribution
  - interpolate_to_heights
  - interpolate_to_times
  - seq_log
  - util_colour_set_opacity

- title: Model registry
  desc: The equations and parameters as data, which documents render from.
  contents:
  - model_registry
  - registry_equation
  - registry_values
  - model_size

- title: FF16 model
  contents:
  - starts_with("FF16_")

- title: K93 model
  contents:
  - starts_with("K93_")

- title: TF24 family of models
  desc: TF24 and its subclasses TF24f, TF24t and TF24w.
  contents:
  - starts_with("TF24")

- title: Internals
  desc: Classes and helpers exposed for testing and diagnosis.
  contents:
  - Schedule
  - OdeControl
  - QK
  - Internals
  - run_plant_benchmarks
  - plant_log_console
