url: https://traitecoevo.github.io/plant/

destination: gh-pages

template:
  bootstrap: 5
  bootswatch: cosmo

navbar:
  title: "plant"
  type: inverse
  left:
    - text: "Home"
      icon: fa-home
      href: index.html
    - text: "Documentation"
      icon: fa-book
      href: https://traitecoevo.github.io/overstorey/
    - text: "Package functions"
      icon: fa-list
      href: reference/index.html

  right:
    - text: "News"
      icon: fa-newspaper-o
      href: news/index.html
    - text: "Github"
      icon: fa-github fa-lg
      href: https://github.com/traitecoevo/plant

